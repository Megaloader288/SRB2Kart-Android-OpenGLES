name: Build SRB2Kart Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Build the APK
        run: |
          set -ex
          export WORK="$PWD/work"
          mkdir -p "$WORK/overlay"
          cd "$WORK"

          # ---------- 1. Embedded files ----------
          cat > "$WORK/overlay/apply_android_changes.py" <<'END_OF_FILE_0'
          # Applies the Android changes to a fresh SRB2Kart source checkout.
          # Usage: python3 apply_android_changes.py <path to Kart-Public/src>
          import sys, os

          src = sys.argv[1]

          def sub(rel, old, new):
              path = os.path.join(src, rel)
              s = open(path, encoding="utf-8", errors="surrogateescape").read()
              if old not in s:
                  raise SystemExit("PATCH FAILED: text not found in %s:\n%s" % (rel, old[:120]))
              s = s.replace(old, new, 1)
              open(path, "w", encoding="utf-8", errors="surrogateescape").write(s)

          T = "\t"

          # 1) Fixes for builds without libcurl (the online server list needs curl)
          sub("d_clisrv.c",
              'va(M_GetText("%s downloading"), ((cl_mode == CL_DOWNLOADHTTPFILES) ? "\\x82""HTTP" : "\\x85""Direct")));',
              'va(M_GetText("%s downloading"),\n'
              '#ifdef HAVE_CURL\n'
              + T*4 + '((cl_mode == CL_DOWNLOADHTTPFILES) ? "\\x82""HTTP" : "\\x85""Direct")\n'
              '#else\n'
              + T*4 + '"\\x85""Direct"\n'
              '#endif\n'
              + T*4 + '));')

          sub("mserv.c",
              T*3 + 'Lock_state();\n' + T*3 + '{\n' + T*4 + 'different = ( MSId != MSRegisteredId );\n' + T*3 + '}\n' + T*3 + 'Unlock_state();',
              '#ifdef MASTERSERVER\n'
              + T*3 + 'Lock_state();\n' + T*3 + '{\n' + T*4 + 'different = ( MSId != MSRegisteredId );\n' + T*3 + '}\n' + T*3 + 'Unlock_state();\n'
              '#else\n' + T*3 + 'different = 0;\n#endif')

          sub("mserv.c",
              'static void MasterServer_OnChange(void)\n{',
              '#ifndef MASTERSERVER\n'
              '// Built without libcurl: no online server list, so these do nothing.\n'
              'void RegisterServer(void) {}\n'
              'void UnregisterServer(void) {}\n'
              'void MasterClient_Ticker(void) {}\n'
              '#endif\n\n'
              'static void MasterServer_OnChange(void)\n{')

          # 2) Touch controls
          sub("sdl/i_video.c",
              '#include "../d_main.h"',
              '#include "../d_main.h"\n#ifdef __ANDROID__\n#include "i_touch.h"\n#endif')

          sub("sdl/i_video.c",
              T*3 + 'case SDL_MOUSEWHEEL:\n' + T*4 + 'Impl_HandleMouseWheelEvent(evt.wheel);\n' + T*4 + 'break;',
              T*3 + 'case SDL_MOUSEWHEEL:\n' + T*4 + 'Impl_HandleMouseWheelEvent(evt.wheel);\n' + T*4 + 'break;\n'
              '#ifdef __ANDROID__\n'
              + T*3 + 'case SDL_FINGERDOWN:\n' + T*3 + 'case SDL_FINGERUP:\n' + T*3 + 'case SDL_FINGERMOTION:\n'
              + T*4 + 'Touch_HandleFingerEvent(renderer, &evt.tfinger, evt.type);\n' + T*4 + 'break;\n'
              '#endif')

          sub("sdl/i_video.c",
              T*2 + 'SDL_RenderClear(renderer);\n' + T*2 + 'SDL_RenderCopy(renderer, texture, &src_rect, NULL);\n' + T*2 + 'SDL_RenderPresent(renderer);',
              T*2 + 'SDL_RenderClear(renderer);\n' + T*2 + 'SDL_RenderCopy(renderer, texture, &src_rect, NULL);\n'
              '#ifdef __ANDROID__\n' + T*2 + 'Touch_Draw(renderer);\n#endif\n'
              + T*2 + 'SDL_RenderPresent(renderer);')

          sub("sdl/i_video.c",
              T*2 + 'SDL_SetHint(SDL_HINT_RENDER_DRIVER, "opengl");',
              '#ifdef __ANDROID__\n'
              + T*2 + '// Android has no desktop OpenGL; let SDL pick GLES. Touch must not act as a mouse.\n'
              + T*2 + 'SDL_SetHint(SDL_HINT_TOUCH_MOUSE_EVENTS, "0");\n'
              '#else\n' + T*2 + 'SDL_SetHint(SDL_HINT_RENDER_DRIVER, "opengl");\n#endif')

          # Android "back" button acts as Escape
          sub("sdl/i_video.c",
              T*2 + 'case SDL_SCANCODE_ESCAPE:         return KEY_ESCAPE;',
              T*2 + 'case SDL_SCANCODE_ESCAPE:         return KEY_ESCAPE;\n'
              '#ifdef __ANDROID__\n'
              + T*2 + 'case SDL_SCANCODE_AC_BACK:        return KEY_ESCAPE;\n'
              '#endif')

          # Fill the whole phone screen: pick an internal resolution with the same
          # shape (aspect ratio) as the display, so there are no black bars.
          sub("sdl/i_video.c",
              T + '//Impl_SetWindowName("SRB2Kart "VERSIONSTRING);',
              '#ifdef __ANDROID__\n'
              + T + '{\n'
              + T*2 + 'int dw = 16, dh = 10;\n'
              + T*2 + 'SDL_DisplayMode dm;\n'
              + T*2 + 'if (window)\n'
              + T*3 + 'SDL_GetWindowSize(window, &dw, &dh);\n'
              + T*2 + 'else if (SDL_GetDesktopDisplayMode(0, &dm) == 0)\n'
              + T*2 + '{\n'
              + T*3 + 'dw = dm.w;\n'
              + T*3 + 'dh = dm.h;\n'
              + T*2 + '}\n'
              + T*2 + 'if (dh > dw)\n'
              + T*2 + '{\n'
              + T*3 + 'int t = dw;\n'
              + T*3 + 'dw = dh;\n'
              + T*3 + 'dh = t;\n'
              + T*2 + '}\n'
              + T*2 + 'if (dw < 1 || dh < 1)\n'
              + T*2 + '{\n'
              + T*3 + 'dw = 16;\n'
              + T*3 + 'dh = 10;\n'
              + T*2 + '}\n'
              + T*2 + 'vid.height = 400; // internal height; lower = faster, higher = sharper\n'
              + T*2 + 'vid.width = (vid.height * dw + dh / 2) / dh;\n'
              + T*2 + 'vid.width &= ~3;\n'
              + T*2 + 'if (vid.width < 640)\n'
              + T*3 + 'vid.width = 640;\n'
              + T*2 + 'if (vid.width > MAXVIDWIDTH)\n'
              + T*3 + 'vid.width = MAXVIDWIDTH;\n'
              + T*2 + 'vid.modenum = -1;\n'
              + T + '}\n'
              '#endif\n'
              + T + '//Impl_SetWindowName("SRB2Kart "VERSIONSTRING);')

          # Mumble positional audio uses shm_open(), which Android does not have
          sub("sdl/i_system.c",
              '#ifdef __linux__ // need -lrt',
              '#if defined (__linux__) && !defined (__ANDROID__) // need -lrt')

          # 3) Android data folder + includes in the main file
          sub("sdl/i_main.c",
              '#ifdef HAVE_TTF\n#include "SDL.h"\n#include "i_ttf.h"\n#endif\n',
              '#ifdef HAVE_TTF\n#include "SDL.h"\n#include "i_ttf.h"\n#endif\n\n'
              '#ifdef __ANDROID__\n'
              '#include "SDL.h"       // renames main() to SDL_main(), which the Android launcher calls\n'
              '#include <sys/stat.h>\n#include <stdlib.h>\n#endif\n')

          sub("sdl/i_main.c",
              T + 'myargv = argv; /// \\todo pull out path to exe from this string\n',
              T + 'myargv = argv; /// \\todo pull out path to exe from this string\n\n'
              '#ifdef __ANDROID__\n'
              + T + '// Game files live in /sdcard/SRB2Kart (put srb2.srb, *.kart, etc. there).\n'
              + T + '// Settings and saves go to /sdcard/SRB2Kart/.srb2kart\n'
              + T + 'setenv("SRB2WADDIR", "/sdcard/SRB2Kart", 1);\n'
              + T + 'setenv("HOME", "/sdcard/SRB2Kart", 1);\n'
              + T + 'mkdir("/sdcard/SRB2Kart", 0777);\n'
              + T + 'if (chdir("/sdcard/SRB2Kart") != 0)\n'
              + T*2 + 'SDL_Log("SRB2Kart: cannot open /sdcard/SRB2Kart");\n'
              '#endif\n')

          print("Android changes applied.")
          END_OF_FILE_0

          cat > "$WORK/overlay/i_touch.c" <<'END_OF_FILE_1'
          // Touchscreen overlay for SRB2Kart on Android.
          // Draws on-screen buttons and turns finger input into key events.
          // Tap EDT (top left) to edit: drag buttons, resize all, add new buttons
          // (ADD), delete the selected one (DEL) or reset (RST). The layout is saved.
          #ifdef __ANDROID__

          #include <stdio.h>
          #include <string.h>
          #include "SDL.h"
          #include "../doomdef.h"
          #include "../d_event.h"
          #include "../d_main.h"
          #include "../keys.h"
          #include "i_touch.h"

          #ifndef TOUCH_CFG_PATH
          #define TOUCH_CFG_PATH "/sdcard/SRB2Kart/touchlayout.cfg"
          #endif

          // ---------- what a button can do ----------

          typedef struct
          {
          	INT32 key;          // key posted to the game
          	const char *label;  // short text on the button
          	Uint8 r, g, b;      // color
          	int arrow;          // 0 = text, 1=left 2=right 3=up 4=down
          	float sizef;        // size relative to the base button size
          } taction_t;

          enum { A_LEFT, A_RIGHT, A_UP, A_DOWN, A_GAS, A_BRAKE, A_DRIFT, A_ITEM, A_ESC, A_OK, A_LOOK,
                 A_SCORES, A_TALK, A_PAUSE, A_CAMERA, A_COUNT };

          static const taction_t actions[A_COUNT] =
          {
          	{ KEY_LEFTARROW,  "",    200,200,200, 1, 1.10f },
          	{ KEY_RIGHTARROW, "",    200,200,200, 2, 1.10f },
          	{ KEY_UPARROW,    "",    200,200,200, 3, 1.10f },
          	{ KEY_DOWNARROW,  "",    200,200,200, 4, 1.10f },
          	{ 'a',            "GAS",  60,200, 60, 0, 1.25f },
          	{ 'd',            "BRK", 220, 60, 60, 0, 1.25f },
          	{ 's',            "DRF",  70,130,240, 0, 1.25f },
          	{ KEY_SPACE,      "ITM", 240,200, 40, 0, 1.25f },
          	{ KEY_ESCAPE,     "ESC", 160,160,160, 0, 0.90f },
          	{ KEY_ENTER,      "OK",  255,255,255, 0, 0.90f },
          	{ KEY_LSHIFT,     "LK",  150,100,200, 0, 0.90f },
          	{ KEY_TAB,        "TAB", 120,200,200, 0, 0.90f },
          	{ 't',            "TLK", 200,140,100, 0, 0.90f },
          	{ KEY_PAUSE,      "PAU", 200,100,150, 0, 0.90f },
          	{ KEY_F12,        "CAM", 100,160,220, 0, 0.90f },
          };

          // ---------- the buttons on screen ----------

          #define MAXBTN 24
          typedef struct { int type; float cx, cy; float x, y, w, h; } tbtn_t;

          static tbtn_t btn[MAXBTN];
          static int nbtn = 0;

          static const struct { int type; float cx, cy; } defaults[] =
          {
          	{ A_LEFT,  0.060f, 0.663f }, { A_RIGHT, 0.159f, 0.663f },
          	{ A_UP,    0.110f, 0.459f }, { A_DOWN,  0.110f, 0.867f },
          	{ A_GAS,   0.935f, 0.855f }, { A_BRAKE, 0.831f, 0.855f },
          	{ A_DRIFT, 0.831f, 0.625f }, { A_ITEM,  0.935f, 0.625f },
          	{ A_ESC,   0.947f, 0.116f }, { A_OK,    0.863f, 0.116f },
          	{ A_LOOK,  0.779f, 0.116f },
          };
          #define NDEFAULTS ((int)(sizeof defaults / sizeof defaults[0]))

          // fixed controls (top left)
          enum { C_EDIT, C_MINUS, C_PLUS, C_RESET, C_ADD, C_DEL, C_COUNT };
          static const char *const ctrl_label[C_COUNT] = { "EDT", "-", "+", "RST", "ADD", "DEL" };
          typedef struct { float x, y, w, h; } trect_t;
          static trect_t ctrl[C_COUNT];
          static trect_t chip[A_COUNT];   // "add button" palette

          #define HIT_CTRL 1000
          #define HIT_CHIP 2000

          #define MAXFINGERS 10
          static struct { SDL_FingerID id; int btn; int drag; float offx, offy; SDL_bool used; } fingers[MAXFINGERS];
          static int typecount[A_COUNT];
          static float ui_scale = 1.0f;
          static SDL_bool editing = SDL_FALSE;
          static SDL_bool add_menu = SDL_FALSE;
          static SDL_bool inited = SDL_FALSE;
          static int selected = -1;

          static float Touch_Clamp(float v, float lo, float hi)
          {
          	return v < lo ? lo : (v > hi ? hi : v);
          }

          // ---------- saving / loading ----------

          static void Touch_Save(void)
          {
          	FILE *f = fopen(TOUCH_CFG_PATH, "w");
          	int i;
          	if (!f)
          		return;
          	fprintf(f, "SRB2KART_TOUCH 2\n");
          	fprintf(f, "scale %.3f\n", ui_scale);
          	for (i = 0; i < nbtn; i++)
          		fprintf(f, "btn %d %.4f %.4f\n", btn[i].type, btn[i].cx, btn[i].cy);
          	fclose(f);
          }

          static void Touch_ResetLayout(void)
          {
          	int i;
          	nbtn = NDEFAULTS;
          	for (i = 0; i < nbtn; i++)
          	{
          		btn[i].type = defaults[i].type;
          		btn[i].cx = defaults[i].cx;
          		btn[i].cy = defaults[i].cy;
          	}
          	ui_scale = 1.0f;
          	selected = -1;
          }

          static void Touch_Load(void)
          {
          	char line[128];
          	int loaded = 0;
          	FILE *f;

          	Touch_ResetLayout();
          	f = fopen(TOUCH_CFG_PATH, "r");
          	if (!f)
          		return;
          	if (!fgets(line, sizeof line, f) || strncmp(line, "SRB2KART_TOUCH", 14) != 0)
          	{
          		fclose(f);
          		return;
          	}
          	while (fgets(line, sizeof line, f))
          	{
          		int t;
          		float a, b;
          		if (sscanf(line, "scale %f", &a) == 1)
          			ui_scale = Touch_Clamp(a, 0.5f, 1.8f);
          		else if (sscanf(line, "btn %d %f %f", &t, &a, &b) == 3 && t >= 0 && t < A_COUNT)
          		{
          			if (!loaded)
          				nbtn = 0;       // a saved layout replaces the defaults
          			loaded = 1;
          			if (nbtn < MAXBTN)
          			{
          				btn[nbtn].type = t;
          				btn[nbtn].cx = Touch_Clamp(a, 0.0f, 1.0f);
          				btn[nbtn].cy = Touch_Clamp(b, 0.0f, 1.0f);
          				nbtn++;
          			}
          		}
          	}
          	fclose(f);
          }

          // ---------- layout ----------

          static void Touch_Layout(int w, int h)
          {
          	float s, size, cs, m, gap, x, y;
          	int i;

          	if (!inited)
          	{
          		inited = SDL_TRUE;
          		Touch_Load();
          	}

          	s = (float)h * 0.17f * ui_scale;
          	for (i = 0; i < nbtn; i++)
          	{
          		float px, py;
          		size = s * actions[btn[i].type].sizef;
          		px = Touch_Clamp(btn[i].cx * (float)w, size * 0.5f, (float)w - size * 0.5f);
          		py = Touch_Clamp(btn[i].cy * (float)h, size * 0.5f, (float)h - size * 0.5f);
          		btn[i].w = btn[i].h = size;
          		btn[i].x = px - size * 0.5f;
          		btn[i].y = py - size * 0.5f;
          	}

          	cs = (float)h * 0.10f;
          	m = (float)h * 0.03f;
          	gap = cs * 0.15f;

          	x = m;
          	for (i = 0; i < C_COUNT; i++)
          	{
          		ctrl[i].x = x;
          		ctrl[i].y = m;
          		ctrl[i].h = cs;
          		ctrl[i].w = (i == C_EDIT) ? cs * 1.4f : cs;
          		x += ctrl[i].w + gap;
          		if (i == C_EDIT)
          			x += cs * 0.4f;     // small gap between EDT and the editing tools
          	}

          	// palette of buttons that can be added (wraps to the screen width)
          	x = m;
          	y = m + cs + gap * 2.0f;
          	for (i = 0; i < A_COUNT; i++)
          	{
          		float cw = cs * 0.95f;
          		if (x + cw > (float)w * 0.75f)
          		{
          			x = m;
          			y += cw + gap;
          		}
          		chip[i].x = x;
          		chip[i].y = y;
          		chip[i].w = chip[i].h = cw;
          		x += cw + gap;
          	}
          }

          static SDL_bool Touch_InRect(const trect_t *r, float px, float py, float tol)
          {
          	float t = r->w * tol;
          	return px >= r->x - t && px <= r->x + r->w + t && py >= r->y - t && py <= r->y + r->h + t;
          }

          static int Touch_HitTest(float px, float py)
          {
          	int i;
          	if (Touch_InRect(&ctrl[C_EDIT], px, py, 0.05f))
          		return HIT_CTRL + C_EDIT;
          	if (editing)
          	{
          		for (i = C_MINUS; i < C_COUNT; i++)
          			if (Touch_InRect(&ctrl[i], px, py, 0.05f))
          				return HIT_CTRL + i;
          		if (add_menu)
          			for (i = 0; i < A_COUNT; i++)
          				if (Touch_InRect(&chip[i], px, py, 0.0f))
          					return HIT_CHIP + i;
          	}
          	for (i = nbtn - 1; i >= 0; i--)
          	{
          		trect_t r = { btn[i].x, btn[i].y, btn[i].w, btn[i].h };
          		if (Touch_InRect(&r, px, py, editing ? 0.0f : 0.06f))
          			return i;
          	}
          	return -1;
          }

          // ---------- key events ----------

          static void Touch_PostKey(INT32 key, evtype_t type)
          {
          	event_t ev;
          	ev.type = type;
          	ev.data1 = key;
          	ev.data2 = 0;
          	ev.data3 = 0;
          	D_PostEvent(&ev);
          }

          static void Touch_Press(int b)
          {
          	int t;
          	if (b < 0 || b >= nbtn) return;
          	t = btn[b].type;
          	if (typecount[t]++ == 0)
          		Touch_PostKey(actions[t].key, ev_keydown);
          }

          static void Touch_Release(int b)
          {
          	int t;
          	if (b < 0 || b >= nbtn) return;
          	t = btn[b].type;
          	if (typecount[t] > 0 && --typecount[t] == 0)
          		Touch_PostKey(actions[t].key, ev_keyup);
          }

          static void Touch_ReleaseAll(void)
          {
          	int i;
          	for (i = 0; i < MAXFINGERS; i++)
          	{
          		fingers[i].used = SDL_FALSE;
          		fingers[i].btn = -1;
          		fingers[i].drag = -1;
          	}
          	for (i = 0; i < A_COUNT; i++)
          		if (typecount[i] > 0)
          		{
          			typecount[i] = 0;
          			Touch_PostKey(actions[i].key, ev_keyup);
          		}
          }

          static void Touch_AddButton(int type)
          {
          	if (nbtn >= MAXBTN || type < 0 || type >= A_COUNT)
          		return;
          	btn[nbtn].type = type;
          	btn[nbtn].cx = 0.5f;
          	btn[nbtn].cy = 0.5f;
          	selected = nbtn;
          	nbtn++;
          }

          static void Touch_DeleteSelected(void)
          {
          	int i;
          	if (selected < 0 || selected >= nbtn)
          		return;
          	for (i = selected; i < nbtn - 1; i++)
          		btn[i] = btn[i + 1];
          	nbtn--;
          	selected = -1;
          }

          static void Touch_ControlTapped(int c)
          {
          	switch (c)
          	{
          		case C_EDIT:
          			editing = !editing;
          			add_menu = SDL_FALSE;
          			selected = -1;
          			Touch_ReleaseAll();     // never leave a key stuck when switching modes
          			if (!editing)
          				Touch_Save();
          			break;
          		case C_MINUS: ui_scale = Touch_Clamp(ui_scale - 0.1f, 0.5f, 1.8f); break;
          		case C_PLUS:  ui_scale = Touch_Clamp(ui_scale + 0.1f, 0.5f, 1.8f); break;
          		case C_RESET: Touch_ResetLayout(); add_menu = SDL_FALSE; break;
          		case C_ADD:   add_menu = !add_menu; break;
          		case C_DEL:   Touch_DeleteSelected(); break;
          	}
          }

          void Touch_HandleFingerEvent(SDL_Renderer *renderer, const SDL_TouchFingerEvent *f, Uint32 type)
          {
          	int w = 0, h = 0, i, slot = -1, hit;
          	float px, py;

          	if (!renderer)
          		return;
          	SDL_GetRendererOutputSize(renderer, &w, &h);
          	if (w <= 0 || h <= 0)
          		return;
          	Touch_Layout(w, h);

          	px = f->x * (float)w;
          	py = f->y * (float)h;

          	for (i = 0; i < MAXFINGERS; i++)
          		if (fingers[i].used && fingers[i].id == f->fingerId)
          			slot = i;

          	if (type == SDL_FINGERDOWN)
          	{
          		hit = Touch_HitTest(px, py);
          		if (slot < 0)
          			for (i = 0; i < MAXFINGERS; i++)
          				if (!fingers[i].used) { slot = i; break; }

          		if (hit >= HIT_CHIP)
          		{
          			Touch_AddButton(hit - HIT_CHIP);
          			add_menu = SDL_FALSE;
          			return;
          		}
          		if (hit >= HIT_CTRL)
          		{
          			Touch_ControlTapped(hit - HIT_CTRL);
          			return;             // controls act on tap only
          		}
          		if (slot < 0)
          			return;
          		fingers[slot].used = SDL_TRUE;
          		fingers[slot].id = f->fingerId;
          		fingers[slot].btn = -1;
          		fingers[slot].drag = -1;

          		if (editing)
          		{
          			if (hit >= 0)
          			{
          				selected = hit;
          				fingers[slot].drag = hit;
          				fingers[slot].offx = btn[hit].x + btn[hit].w * 0.5f - px;
          				fingers[slot].offy = btn[hit].y + btn[hit].h * 0.5f - py;
          			}
          			else
          			{
          				selected = -1;
          				add_menu = SDL_FALSE;
          			}
          		}
          		else
          		{
          			fingers[slot].btn = hit;
          			Touch_Press(hit);
          		}
          	}
          	else if (type == SDL_FINGERMOTION)
          	{
          		if (slot < 0)
          			return;
          		if (editing)
          		{
          			int d = fingers[slot].drag;
          			if (d >= 0 && d < nbtn)
          			{
          				btn[d].cx = Touch_Clamp((px + fingers[slot].offx) / (float)w, 0.02f, 0.98f);
          				btn[d].cy = Touch_Clamp((py + fingers[slot].offy) / (float)h, 0.02f, 0.98f);
          			}
          			return;
          		}
          		hit = Touch_HitTest(px, py);
          		if (hit >= HIT_CTRL)
          			hit = -1;
          		if (fingers[slot].btn != hit)
          		{
          			Touch_Release(fingers[slot].btn);
          			fingers[slot].btn = hit;
          			Touch_Press(hit);
          		}
          	}
          	else if (type == SDL_FINGERUP)
          	{
          		if (slot < 0)
          			return;
          		Touch_Release(fingers[slot].btn);
          		fingers[slot].used = SDL_FALSE;
          		fingers[slot].btn = -1;
          		fingers[slot].drag = -1;
          	}
          }

          // ---- tiny 3x5 font for button labels ----
          static const struct { char c; const char *rows[5]; } font3x5[] =
          {
          	{ 'A', { "010", "101", "111", "101", "101" } },
          	{ 'B', { "110", "101", "110", "101", "110" } },
          	{ 'C', { "011", "100", "100", "100", "011" } },
          	{ 'D', { "110", "101", "101", "101", "110" } },
          	{ 'E', { "111", "100", "110", "100", "111" } },
          	{ 'F', { "111", "100", "110", "100", "100" } },
          	{ 'G', { "011", "100", "101", "101", "011" } },
          	{ 'I', { "111", "010", "010", "010", "111" } },
          	{ 'K', { "101", "101", "110", "101", "101" } },
          	{ 'L', { "100", "100", "100", "100", "111" } },
          	{ 'M', { "101", "111", "111", "101", "101" } },
          	{ 'N', { "110", "101", "101", "101", "101" } },
          	{ 'O', { "010", "101", "101", "101", "010" } },
          	{ 'P', { "110", "101", "110", "100", "100" } },
          	{ 'R', { "110", "101", "110", "101", "101" } },
          	{ 'S', { "011", "100", "010", "001", "110" } },
          	{ 'T', { "111", "010", "010", "010", "010" } },
          	{ 'U', { "101", "101", "101", "101", "111" } },
          	{ '-', { "000", "000", "111", "000", "000" } },
          	{ '+', { "000", "010", "111", "010", "000" } },
          };

          static const char *const *Touch_Glyph(char c)
          {
          	size_t i;
          	for (i = 0; i < sizeof font3x5 / sizeof font3x5[0]; i++)
          		if (font3x5[i].c == c)
          			return font3x5[i].rows;
          	return NULL;
          }

          static void Touch_DrawText(SDL_Renderer *r, const char *text, float x, float y, float px)
          {
          	for (; *text; text++)
          	{
          		const char *const *g = Touch_Glyph(*text);
          		int row, col;
          		if (g)
          			for (row = 0; row < 5; row++)
          				for (col = 0; col < 3; col++)
          					if (g[row][col] == '1')
          					{
          						SDL_Rect rc = { (int)(x + col * px), (int)(y + row * px), (int)px + 1, (int)px + 1 };
          						SDL_RenderFillRect(r, &rc);
          					}
          		x += px * 4;
          	}
          }

          static void Touch_DrawLabel(SDL_Renderer *r, const char *label, float x, float y, float w, float h, float refw)
          {
          	float px = refw / 18.0f;
          	int len = (int)SDL_strlen(label);
          	float tw;
          	if (px < 1.0f) px = 1.0f;
          	tw = (len * 4 - 1) * px;
          	Touch_DrawText(r, label, x + (w - tw) * 0.5f, y + (h - 5 * px) * 0.5f, px);
          }

          static void Touch_DrawArrow(SDL_Renderer *r, float x, float y, float w, float h, int arrow)
          {
          	int i, n = (int)(w * 0.5f);
          	float cx = x + w * 0.5f, cy = y + h * 0.5f, half = w * 0.28f;
          	for (i = 0; i < n; i++)
          	{
          		float t = (float)i / (float)n;
          		float len = half * (1.0f - t);
          		switch (arrow)
          		{
          			case 1: SDL_RenderDrawLine(r, (int)(cx + half - t * half * 2), (int)(cy - len), (int)(cx + half - t * half * 2), (int)(cy + len)); break;
          			case 2: SDL_RenderDrawLine(r, (int)(cx - half + t * half * 2), (int)(cy - len), (int)(cx - half + t * half * 2), (int)(cy + len)); break;
          			case 3: SDL_RenderDrawLine(r, (int)(cx - len), (int)(cy + half - t * half * 2), (int)(cx + len), (int)(cy + half - t * half * 2)); break;
          			case 4: SDL_RenderDrawLine(r, (int)(cx - len), (int)(cy - half + t * half * 2), (int)(cx + len), (int)(cy - half + t * half * 2)); break;
          		}
          	}
          }

          static void Touch_DrawBox(SDL_Renderer *r, float x, float y, float w, float h, const taction_t *a, Uint8 fill, Uint8 border)
          {
          	SDL_Rect rc = { (int)x, (int)y, (int)w, (int)h };
          	SDL_SetRenderDrawColor(r, a->r, a->g, a->b, fill);
          	SDL_RenderFillRect(r, &rc);
          	SDL_SetRenderDrawColor(r, a->r, a->g, a->b, border);
          	SDL_RenderDrawRect(r, &rc);
          }

          static void Touch_DrawAction(SDL_Renderer *r, const taction_t *a, float x, float y, float w, float h, Uint8 fill, Uint8 border)
          {
          	Touch_DrawBox(r, x, y, w, h, a, fill, border);
          	SDL_SetRenderDrawColor(r, 255, 255, 255, 220);
          	if (a->arrow)
          		Touch_DrawArrow(r, x, y, w, h, a->arrow);
          	else
          		Touch_DrawLabel(r, a->label, x, y, w, h, w);
          }

          static SDL_bool Touch_IsHeld(int b)
          {
          	int i;
          	for (i = 0; i < MAXFINGERS; i++)
          		if (fingers[i].used && fingers[i].btn == b)
          			return SDL_TRUE;
          	return SDL_FALSE;
          }

          void Touch_Draw(SDL_Renderer *renderer)
          {
          	static const taction_t tool = { 0, "", 230, 150, 40, 0, 0 };
          	int w = 0, h = 0, i, lw = 0, lh = 0;
          	SDL_BlendMode oldblend;
          	Uint8 or_, og, ob, oa;
          	float cref;

          	if (!renderer)
          		return;
          	SDL_GetRendererOutputSize(renderer, &w, &h);
          	if (w <= 0 || h <= 0)
          		return;
          	Touch_Layout(w, h);
          	cref = ctrl[C_MINUS].w;

          	SDL_RenderGetLogicalSize(renderer, &lw, &lh);
          	SDL_RenderSetLogicalSize(renderer, 0, 0);
          	SDL_GetRenderDrawBlendMode(renderer, &oldblend);
          	SDL_GetRenderDrawColor(renderer, &or_, &og, &ob, &oa);
          	SDL_SetRenderDrawBlendMode(renderer, SDL_BLENDMODE_BLEND);

          	if (editing)
          	{
          		SDL_Rect all = { 0, 0, w, h };
          		SDL_SetRenderDrawColor(renderer, 0, 0, 0, 110);
          		SDL_RenderFillRect(renderer, &all);
          	}

          	for (i = 0; i < nbtn; i++)
          	{
          		const taction_t *a = &actions[btn[i].type];
          		Touch_DrawAction(renderer, a, btn[i].x, btn[i].y, btn[i].w, btn[i].h,
          			editing ? 120 : (Touch_IsHeld(i) ? 140 : 60), editing ? 255 : 170);
          		if (editing)
          		{
          			// white inner frame; yellow thick frame for the selected button
          			SDL_Rect in = { (int)btn[i].x + 2, (int)btn[i].y + 2, (int)btn[i].w - 4, (int)btn[i].h - 4 };
          			SDL_SetRenderDrawColor(renderer, 255, 255, 255, 255);
          			SDL_RenderDrawRect(renderer, &in);
          			if (i == selected)
          			{
          				int k;
          				SDL_SetRenderDrawColor(renderer, 255, 230, 0, 255);
          				for (k = 0; k < 4; k++)
          				{
          					SDL_Rect sr = { (int)btn[i].x - k, (int)btn[i].y - k, (int)btn[i].w + 2 * k, (int)btn[i].h + 2 * k };
          					SDL_RenderDrawRect(renderer, &sr);
          				}
          			}
          		}
          	}

          	// the EDT / DONE button (always shown, faint outside edit mode)
          	Touch_DrawBox(renderer, ctrl[C_EDIT].x, ctrl[C_EDIT].y, ctrl[C_EDIT].w, ctrl[C_EDIT].h, &tool, editing ? 200 : 45, editing ? 255 : 120);
          	SDL_SetRenderDrawColor(renderer, 255, 255, 255, editing ? 255 : 150);
          	Touch_DrawLabel(renderer, editing ? "DONE" : "EDT", ctrl[C_EDIT].x, ctrl[C_EDIT].y, ctrl[C_EDIT].w, ctrl[C_EDIT].h, cref);

          	if (editing)
          	{
          		for (i = C_MINUS; i < C_COUNT; i++)
          		{
          			Touch_DrawBox(renderer, ctrl[i].x, ctrl[i].y, ctrl[i].w, ctrl[i].h, &tool, 200, 255);
          			SDL_SetRenderDrawColor(renderer, 255, 255, 255, 255);
          			Touch_DrawLabel(renderer, ctrl_label[i], ctrl[i].x, ctrl[i].y, ctrl[i].w, ctrl[i].h, cref);
          		}
          		if (add_menu)
          			for (i = 0; i < A_COUNT; i++)
          				Touch_DrawAction(renderer, &actions[i], chip[i].x, chip[i].y, chip[i].w, chip[i].h, 200, 255);
          		else
          		{
          			const char *hint = "DRAG BUTTONS";
          			float px = (float)h * 0.012f;
          			float tw = (float)(SDL_strlen(hint) * 4 - 1) * px;
          			SDL_SetRenderDrawColor(renderer, 255, 255, 255, 230);
          			Touch_DrawText(renderer, hint, ((float)w - tw) * 0.5f, (float)h * 0.45f, px);
          		}
          	}

          	SDL_SetRenderDrawColor(renderer, or_, og, ob, oa);
          	SDL_SetRenderDrawBlendMode(renderer, oldblend);
          	SDL_RenderSetLogicalSize(renderer, lw, lh);
          }

          #endif // __ANDROID__
          END_OF_FILE_1

