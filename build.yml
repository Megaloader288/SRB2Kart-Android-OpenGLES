          VDOhglKhqTRuSlOhbqNNRm21zkaNriKbMiFoKpSxhyZEtTspt8A8i6z0TCc4zDyD3XLDAySApoo/
          Si4PedLCvrMYIUuK8HfecWCN8UyrkJg5kSbZy5I1jJsyZpep7qumTHUpCJo9RSotTak5hsxxuGWG
          u1BdEvXCATjsLbmPJu+cuftnF0AiScrwOa/WeFrsd0/DHPem55Me81pEICN5Wpq7Q81R7iNI68PV
          UPX55DUh7TifjyMAQop5rnL+T+oU7Hvhem/6qYdgyU9m0ElL7maX2kWyV4H4LFsgKUl2uNSVkV/y
          IL2SvR57P7vnXksO/K5pyl3p0mTHbMu/zztqO0rh77wj9jkfhCfg8V6xL5Ed4KudQf1o8s7Oiu59
          7WNpkzKkIU3e6fJYq3HQXuEpPA7wVUhlLk/eGdJ9Lf/jbopoji/1Ccu0+tgm9bROQHgKJ+CAglyF
          3AZvTa6azfQ+6VMZ8qQVlvu4S3VoUBzMp+GgUEEhFjhc5W3J+j39/qe4KZJWyJL1yYu93XqZpCcF
          e0iY5aQPJGNPuPMTmfXenrw4WR+yx1/+J7UpQkISwhK/75dVORjU0UF6ANvj7Bs+4o+Tze11s39O
          ZfsghZXe4w2q2omo9L/EMANFydDwaX+RrOqs2JM5tU/2MxJpUhBWerM3WRrtfDjQacyDzgUruwVH
          m1zhU8kqQqZMnqSqfkpLF9I2kh2WeqlXeJ45e+BoDskxLk/duxeTC53VG/VdX/KNZFM7q5I8BZb7
          p7x3QyptH65whBf4Kc90ooH/pCdgygNucr1/Sx5rK2pl8hRHDPxYyiMkMqGN64XMKY52YeQkOPMQ
          HWj3VMKrOxQedp9/t9Y93VVIFMmP4SH+/w+yPc8WKtfPAAAAAElFTkSuQmCC
          END_OF_FILE_12

          # ---------- 2. Get the sources (pinned versions) ----------
          git clone https://github.com/STJr/Kart-Public.git kart
          git -C kart checkout -q 44b4a6852858eebba5f9f50da2ac9f4b2889ad1a
          python3 overlay/apply_android_changes.py kart/src
          cp overlay/i_touch.c overlay/i_touch.h overlay/i_crash.c kart/src/sdl/

          curl -fsSL -o sdl2.tgz https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
          curl -fsSL -o mixer.tgz https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-2.8.0.tar.gz
          tar xzf sdl2.tgz
          tar xzf mixer.tgz

          # ---------- 3. Assemble the Android project ----------
          cp -r SDL2-2.30.9/android-project proj
          J=proj/app/jni
          mkdir -p $J/SDL $J/SDL_mixer $J/src/kart
          cp -r SDL2-2.30.9/include SDL2-2.30.9/src SDL2-2.30.9/Android.mk $J/SDL/
          cp -r SDL2_mixer-2.8.0/include SDL2_mixer-2.8.0/src SDL2_mixer-2.8.0/Android.mk $J/SDL_mixer/
          sed -i 's/SUPPORT_WAVPACK ?= true/SUPPORT_WAVPACK ?= false/' $J/SDL_mixer/Android.mk
          cp -r kart/src/. $J/src/kart/
          rm -rf $J/src/kart/Android.mk $J/src/kart/android $J/src/CMakeLists.txt $J/CMakeLists.txt
          cp overlay/Android.src.mk $J/src/Android.mk
          cp overlay/Application.mk $J/Application.mk
          cp overlay/app_build.gradle proj/app/build.gradle
          cp overlay/AndroidManifest.xml proj/app/src/main/AndroidManifest.xml
          cp overlay/KartActivity.java overlay/PermissionActivity.java proj/app/src/main/java/org/libsdl/app/
          sed -i 's|<string name="app_name">Game</string>|<string name="app_name">SRB2Kart</string>|' proj/app/src/main/res/values/strings.xml
          echo "org.gradle.jvmargs=-Xmx3g" >> proj/gradle.properties

          # app icon (replaces the default SDL logo)
          RES=proj/app/src/main/res
          rm -f $RES/mipmap-*/ic_launcher.png
          mkdir -p $RES/mipmap-xhdpi $RES/mipmap-xxxhdpi
          base64 -d overlay/ic_xhdpi.b64 > $RES/mipmap-xhdpi/ic_launcher.png
          base64 -d overlay/ic_xxxhdpi.b64 > $RES/mipmap-xxxhdpi/ic_launcher.png

          # ---------- 3b. Optional: libcurl for the online server list ----------
          if bash -e "$WORK/overlay/build_curl.sh" > "$WORK/curl-build.log" 2>&1; then
            printf 'CURL_PREFIX := %s\n' "$WORK/curl-prebuilt" > "$J/src/curl.mk"
            echo "libcurl built: online server list ENABLED"
            echo "### Online server list: ENABLED (libcurl built)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::libcurl build failed - building the APK WITHOUT the online server list"
            tail -n 40 "$WORK/curl-build.log" || true
            {
              echo "### Online server list: DISABLED (libcurl failed to build)"
              echo "The APK is still built. To get the server list, send this to Claude:"
              echo '```'
              grep -n -E "error|Error|CMake Error" "$WORK/curl-build.log" | head -25 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # ---------- 3c. Keep copies of the project for the two OpenGL variants (built after the normal APKs) ----------
          cp -r proj proj-gl
          cp -r proj proj-gl2

          # ---------- 4. Build (64-bit + 32-bit; falls back to 64-bit only) ----------
          cd proj
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$WORK/build-both.log"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -eq 0 ]; then
            cp "$WORK/build-both.log" "$WORK/build.log"
            echo "### APK built for 64-bit AND 32-bit phones" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::64+32-bit build failed - retrying with 64-bit only"
            {
              echo "### 32-bit support FAILED - retrying 64-bit only. Errors from the first try:"
              echo '```'
              grep -n -E "error:|FAILED|What went wrong|undefined reference|fatal" "$WORK/build-both.log" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sed -i 's/arm64-v8a armeabi-v7a/arm64-v8a/' app/jni/Application.mk
            sed -i "s/abiFilters 'arm64-v8a', 'armeabi-v7a'/abiFilters 'arm64-v8a'/" app/build.gradle
            ./gradlew --no-daemon --stacktrace clean assembleDebug 2>&1 | tee "$WORK/build.log"
            STATUS=${PIPESTATUS[0]}
          fi
          set -e
          mkdir -p "$WORK/out"
          if [ "$STATUS" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "$WORK/out/SRB2Kart-debug.apk"

            # Optional: an optimized ("fast") APK. The normal one is compiled without optimization.
            set +e
            ./gradlew --no-daemon assembleRelease 2>&1 | tee "$WORK/build-release.log"
            RSTATUS=${PIPESTATUS[0]}
            set -e
            if [ "$RSTATUS" -eq 0 ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
              cp app/build/outputs/apk/release/app-release.apk "$WORK/out/SRB2Kart-fast.apk"
              echo "### Optimized FAST APK built too" >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### The optimized FAST APK failed (the normal APK is fine). Errors:"
                echo '```'
                grep -n -E "error:|FAILED|What went wrong" "$WORK/build-release.log" | head -20
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # ---------- 5. OpenGL variants. Each is its own APK; a failure here never affects the APKs above. ----------
          if [ "$STATUS" -eq 0 ]; then
            # 5a. libpng (reads the PNG textures of 3D models), shared by both variants
            mkdir -p "$WORK/glwork"
            set +e
            (
              set -ex
              cd "$WORK/glwork"
              curl -fsSL -o libpng.tgz https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.43.tar.gz \
                || curl -fsSL -o libpng.tgz https://downloads.sourceforge.net/project/libpng/libpng16/1.6.43/libpng-1.6.43.tar.gz
              tar xzf libpng.tgz
              test -f libpng-1.6.43/png.c
            ) > "$WORK/gl-build.log" 2>&1
            PNGSTATUS=$?
            set -e

            if [ "$PNGSTATUS" -ne 0 ]; then
              echo "### The OpenGL APKs were skipped: libpng could not be downloaded (the normal APKs above are fine)." >> "$GITHUB_STEP_SUMMARY"
            else
              # 5b. OpenGL ES 1.1: the stable one
              set +e
              (
                set -ex
                cd "$WORK"
                cp -r glwork/libpng-1.6.43 proj-gl/app/jni/src/libpng
                python3 overlay/apply_gl_changes.py proj-gl/app/jni overlay es1
                cd proj-gl
                # a separate app, so it installs next to the normal one; 64-bit phones only
                sed -i 's/applicationId "com.srb2kart.mobile"/applicationId "com.srb2kart.mobile.gl"/' app/build.gradle
                sed -i 's|<string name="app_name">SRB2Kart</string>|<string name="app_name">SRB2Kart GL</string>|' app/src/main/res/values/strings.xml
                sed -i 's/arm64-v8a armeabi-v7a/arm64-v8a/' app/jni/Application.mk
                sed -i "s/abiFilters 'arm64-v8a', 'armeabi-v7a'/abiFilters 'arm64-v8a'/" app/build.gradle
                chmod +x gradlew
                ./gradlew --no-daemon --stacktrace assembleRelease
                cp app/build/outputs/apk/release/app-release.apk "$WORK/out/SRB2Kart-GL-fast.apk"
              ) >> "$WORK/gl-build.log" 2>&1
              GLSTATUS=$?
              set -e
              if [ "$GLSTATUS" -eq 0 ]; then
                echo "### OpenGL + 3D models APK built: SRB2Kart-GL-fast.apk (64-bit phones)" >> "$GITHUB_STEP_SUMMARY"
              else
                {
                  echo "### The OpenGL APK failed (the normal APKs above are fine). Errors:"
                  echo '```'
                  grep -n -E "PATCH FAILED|error:|FAILED|What went wrong|undefined reference|fatal" "$WORK/gl-build.log" | head -40
                  echo '```'
                  echo "Send that text to Claude to fix the OpenGL build."
                } >> "$GITHUB_STEP_SUMMARY"
              fi

              # 5c. OpenGL ES 2 through gl4es: the game's shaders and faster batching. Experimental.
              set +e
              (
                set -ex
                cd "$WORK/glwork"
                git clone --depth 1 https://github.com/ptitSeb/gl4es.git gl4es
                git -C gl4es log -1 --format='gl4es commit %H'
                NDK="$ANDROID_HOME/ndk/26.3.11579264"
                cmake -S gl4es -B gl4es-build \
                  -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                  -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
                  -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                  -DNOX11=ON -DNOEGL=ON -DDEFAULT_ES=2 -DNO_INIT_CONSTRUCTOR=ON \
                  -DCMAKE_C_FLAGS="-DANDROID -w"
                cmake --build gl4es-build --target GL -j"$(nproc)"
                GL4ESLIB="$(find gl4es gl4es-build -name 'libGL.so*' -type f | head -1)"
                echo "gl4es library: $GL4ESLIB"
                test -n "$GL4ESLIB"
                cd "$WORK"
                mkdir -p proj-gl2/app/libs/arm64-v8a
                cp "glwork/$GL4ESLIB" proj-gl2/app/libs/arm64-v8a/libgl4es.so
                cp -r glwork/libpng-1.6.43 proj-gl2/app/jni/src/libpng
                python3 overlay/apply_gl_changes.py proj-gl2/app/jni overlay es2
                cd proj-gl2
                sed -i 's/applicationId "com.srb2kart.mobile"/applicationId "com.srb2kart.mobile.gl2"/' app/build.gradle
                sed -i 's|<string name="app_name">SRB2Kart</string>|<string name="app_name">SRB2Kart GL2</string>|' app/src/main/res/values/strings.xml
                sed -i 's/arm64-v8a armeabi-v7a/arm64-v8a/' app/jni/Application.mk
                sed -i "s/abiFilters 'arm64-v8a', 'armeabi-v7a'/abiFilters 'arm64-v8a'/" app/build.gradle
                chmod +x gradlew
                ./gradlew --no-daemon --stacktrace assembleRelease
                cp app/build/outputs/apk/release/app-release.apk "$WORK/out/SRB2Kart-GL2-fast.apk"
              ) > "$WORK/gl2-build.log" 2>&1
              GL2STATUS=$?
              set -e
              if [ "$GL2STATUS" -eq 0 ]; then
                echo "### OpenGL ES 2 (gl4es) APK built: SRB2Kart-GL2-fast.apk (64-bit phones, experimental)" >> "$GITHUB_STEP_SUMMARY"
              else
                {
                  echo "### The OpenGL ES 2 APK failed (the other APKs are fine). Errors:"
                  echo '```'
                  grep -n -E "PATCH FAILED|error:|FAILED|What went wrong|undefined reference|fatal|CMake Error" "$WORK/gl2-build.log" | head -40
                  echo '```'
                  echo "Send that text to Claude to fix the ES 2 build."
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          exit $STATUS

      - name: Show errors (only if the build failed)
        if: failure()
        run: |
          {
            echo "## Build failed - copy the text below and send it to Claude"
            echo '```'
            grep -n -E "error:|FAILED|What went wrong|undefined reference|fatal" work/build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            work/build.log
            work/build-both.log
            work/build-release.log
            work/curl-build.log
            work/gl-build.log
            work/gl2-build.log
          if-no-files-found: ignore

      - name: Publish APK as a release (easy download on a phone)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" work/out/*.apk \
            --repo "${{ github.repository }}" \
            --title "SRB2Kart Android build ${{ github.run_number }}" \
            --notes "SRB2Kart-debug.apk / SRB2Kart-fast.apk: software renderer. SRB2Kart-GL-fast.apk (if present): OpenGL ES 1.1 renderer with 3D models (stable). SRB2Kart-GL2-fast.apk (if present): OpenGL ES 2 through gl4es, with shaders (experimental). Install one, then copy the game files to /sdcard/SRB2Kart."
