          };

          static const char *const *Touch_Glyph(char c)
          {
          	size_t i;
          	for (i = 0; i < sizeof font5x7 / sizeof font5x7[0]; i++)
          		if (font5x7[i].c == c)
          			return font5x7[i].rows;
          	return NULL;
          }

          static int Touch_TextWidth(const char *s, int p)
          {
          	int len = (int)SDL_strlen(s);
          	return len > 0 ? (len * 6 - 1) * p : 0;
          }

          static void Touch_DrawGlyphs(SDL_Renderer *r, const char *text, int x, int y, int p)
          {
          	for (; *text; text++)
          	{
          		const char *const *g = Touch_Glyph(*text);
          		if (g)
          		{
          			int row, col;
          			for (row = 0; row < 7; row++)
          				for (col = 0; col < 5; col++)
          					if (g[row][col] == 'X')
          					{
          						SDL_Rect rc = { x + col * p, y + row * p, p, p };
          						SDL_RenderFillRect(r, &rc);
          					}
          		}
          		x += 6 * p;
          	}
          }

          // text with a dark shadow, like the game's own menu text
          static void Touch_DrawText(SDL_Renderer *r, const char *text, int x, int y, int p, Uint8 cr, Uint8 cg, Uint8 cb, Uint8 ca)
          {
          	int sh = p > 2 ? p / 2 : 1;
          	SDL_SetRenderDrawColor(r, 0, 0, 0, (Uint8)(ca * 0.8f));
          	Touch_DrawGlyphs(r, text, x + sh, y + sh, p);
          	SDL_SetRenderDrawColor(r, cr, cg, cb, ca);
          	Touch_DrawGlyphs(r, text, x, y, p);
          }

          // ======================================================================
          //  Layout
          // ======================================================================

          typedef struct { float x, y, w, h; } trect_t;

          enum { C_DONE, C_CTX, C_RESET, C_SMALLER, C_BIGGER, C_LESSOP, C_MOREOP, C_ADD, C_DEL, C_EDITCOUNT,
                 C_CANCEL = C_EDITCOUNT, C_COUNT };
          static trect_t ctrl[C_COUNT];
          static trect_t chip[A_COUNT];
          static float ctrl_h = 0;
          static int ctrl_p = 1;

          static const char *Touch_CtrlLabel(int c)
          {
          	switch (c)
          	{
          		case C_DONE: return "DONE";
          		case C_CTX: return edit_ctx == CTX_RACE ? "EDITING: RACE" : "EDITING: MENU";
          		case C_RESET: return "RESET";
          		case C_SMALLER: return "SIZE -";
          		case C_BIGGER: return "SIZE +";
          		case C_LESSOP: return "OPACITY -";
          		case C_MOREOP: return "OPACITY +";
          		case C_ADD: return "ADD BUTTON";
          		case C_DEL: return "DELETE";
          		case C_CANCEL: return "CANCEL";
          	}
          	return "";
          }

          static int Touch_CurrentContext(void)
          {
          	if (editing)
          		return edit_ctx;
          	if (menuactive || gamestate != GS_LEVEL)
          		return CTX_MENU;
          	return CTX_RACE;
          }

          static void Touch_Layout(int w, int h)
          {
          	float s, m, gap, x, y;
          	int c, i, ctx;

          	if (!inited)
          	{
          		inited = SDL_TRUE;
          		Touch_Load();
          	}

          	ctx = Touch_CurrentContext();
          	s = ((float)h * 0.15f < (float)w * 0.072f ? (float)h * 0.15f : (float)w * 0.072f) * ui_scale;
          	for (i = 0; i < nbtn[ctx]; i++)
          	{
          		const taction_t *a = &actions[btn[ctx][i].type];
          		float bw = s * a->w, bh = s * a->h;
          		float px = Touch_Clamp(btn[ctx][i].cx * (float)w, bw * 0.5f, (float)w - bw * 0.5f);
          		float py = Touch_Clamp(btn[ctx][i].cy * (float)h, bh * 0.5f, (float)h - bh * 0.5f);
          		btn[ctx][i].w = bw;
          		btn[ctx][i].h = bh;
          		btn[ctx][i].x = px - bw * 0.5f;
          		btn[ctx][i].y = py - bh * 0.5f;
          	}

          	// editor controls: two rows at the top-left
          	ctrl_h = (float)h * 0.085f;
          	ctrl_p = (int)(ctrl_h * 0.30f / 7.0f);
          	if (ctrl_p < 1)
          		ctrl_p = 1;
          	m = (float)h * 0.025f;
          	gap = ctrl_h * 0.12f;
          	for (c = 0; c < C_COUNT; c++)
          	{
          		ctrl[c].w = (float)Touch_TextWidth(Touch_CtrlLabel(c), ctrl_p) + ctrl_h * 0.7f;
          		ctrl[c].h = ctrl_h;
          	}
          	x = m;
          	y = m;
          	for (c = C_DONE; c <= C_RESET; c++)
          	{
          		ctrl[c].x = x;
          		ctrl[c].y = y;
          		x += ctrl[c].w + gap;
          	}
          	x = m;
          	y = m + ctrl_h + gap;
          	for (c = C_SMALLER; c < C_EDITCOUNT; c++)
          	{
          		ctrl[c].x = x;
          		ctrl[c].y = y;
          		x += ctrl[c].w + gap;
          	}
          	// CANCEL (shown while typing): top right
          	ctrl[C_CANCEL].x = (float)w - m - ctrl[C_CANCEL].w;
          	ctrl[C_CANCEL].y = m;

          	// palette of buttons that can be added
          	x = m;
          	y = m + 2 * (ctrl_h + gap) + gap;
          	for (i = 0; i < A_COUNT; i++)
          	{
          		float cw = (float)Touch_TextWidth(actions[i].label, ctrl_p) + ctrl_h * 0.7f;
          		if (actions[i].arrow)
          			cw = ctrl_h * 1.2f;
          		if (x + cw > (float)w - m)
          		{
          			x = m;
          			y += ctrl_h + gap;
          		}
          		chip[i].x = x;
          		chip[i].y = y;
          		chip[i].w = cw;
          		chip[i].h = ctrl_h;
          		x += cw + gap;
          	}
          }

          static SDL_bool Touch_InRect(const trect_t *r, float px, float py, float tol)
          {
          	float t = r->h * tol;
          	return px >= r->x - t && px <= r->x + r->w + t && py >= r->y - t && py <= r->y + r->h + t;
          }

          static int Touch_HitTest(float px, float py)
          {
          	int i, ctx = Touch_CurrentContext();
          	if (typing && !editing)
          		return Touch_InRect(&ctrl[C_CANCEL], px, py, 0.1f) ? HIT_CTRL + C_CANCEL : -1;
          	if (editing)
          	{
          		for (i = 0; i < C_EDITCOUNT; i++)
          			if (Touch_InRect(&ctrl[i], px, py, 0.05f))
          				return HIT_CTRL + i;
          		if (add_menu)
          			for (i = 0; i < A_COUNT; i++)
          				if (Touch_InRect(&chip[i], px, py, 0.0f))
          					return HIT_CHIP + i;
          	}
          	for (i = nbtn[ctx] - 1; i >= 0; i--)
          	{
          		trect_t r = { btn[ctx][i].x, btn[ctx][i].y, btn[ctx][i].w, btn[ctx][i].h };
          		if (Touch_InRect(&r, px, py, editing ? 0.0f : 0.05f))
          			return i;
          	}
          	return -1;
          }

          // ======================================================================
          //  Sending keys to the game
          // ======================================================================

          static void Touch_PostKey(INT32 key, evtype_t type)
          {
          	event_t ev;
          	if (key == KEY_NONE)
          		return;
          	ev.type = type;
          	ev.data1 = key;
          	ev.data2 = 0;
          	ev.data3 = 0;
          	D_PostEvent(&ev);
          }

          static SDL_bool Touch_TextWanted(void)
          {
          	INT32 k;
          	if (chat_on || CON_Ready())
          		return SDL_TRUE;
          	k = M_TextInputKey();
          	return (k != 0 && k == armed_key) ? SDL_TRUE : SDL_FALSE;
          }

          void Touch_ArmTextInput(void)
          {
          	armed_key = M_TextInputKey();
          }

          static void Touch_UpdateTextInput(void)
          {
          	typing = editing ? SDL_FALSE : Touch_TextWanted();
          	if (typing && !SDL_IsTextInputActive())
          		SDL_StartTextInput();
          	else if (!typing && SDL_IsTextInputActive())
          		SDL_StopTextInput();
          	if (!typing && !M_TextInputKey())
          		armed_key = 0;
          }

          void Touch_TextInputEvent(const char *text)
          {
          	const unsigned char *p = (const unsigned char *)text;
          	for (; *p; p++)
          		if (*p >= 32 && *p < 127)      // plain ASCII; the game's font has no other characters
          		{
          			Touch_PostKey(*p, ev_keydown);
          			Touch_PostKey(*p, ev_keyup);
          		}
          }

          SDL_bool Touch_SuppressKey(int key)
          {
          	// While the keyboard is up, typed characters arrive as text (SDL_TEXTINPUT);
          	// ignore the duplicate key events SDL makes for them.
          	if (key == KEY_ENTER && armed_key)
          		armed_key = 0;              // Enter on the keyboard closes it
          	return (SDL_IsTextInputActive() && key >= 32 && key < 127) ? SDL_TRUE : SDL_FALSE;
          }

          static void Touch_Press(int ctx, int b)
          {
          	int t;
          	if (b < 0 || b >= nbtn[ctx]) return;
          	t = btn[ctx][b].type;
          	if (t == A_KEYBOARD)
          	{
          		if (SDL_IsTextInputActive()) SDL_StopTextInput(); else SDL_StartTextInput();
          		return;
          	}
          	if (t == A_OK && M_TextInputKey())
          		Touch_ArmTextInput();       // OK on a text field = start typing
          	if (typecount[t]++ == 0)
          		Touch_PostKey(actions[t].key, ev_keydown);
          }

          static void Touch_Release(int ctx, int b)
          {
          	int t;
          	if (b < 0 || b >= nbtn[ctx]) return;
          	t = btn[ctx][b].type;
          	if (typecount[t] > 0 && --typecount[t] == 0)
          		Touch_PostKey(actions[t].key, ev_keyup);
          }

          static void Touch_ReleaseAll(void)
          {
          	int i;
          	for (i = 0; i < MAXFINGERS; i++)
          	{
          		fingers[i].used = SDL_FALSE;
          		fingers[i].btn = -1;
          		fingers[i].drag = -1;
          	}
          	for (i = 0; i < A_COUNT; i++)
          		if (typecount[i] > 0)
          		{
          			typecount[i] = 0;
          			Touch_PostKey(actions[i].key, ev_keyup);
          		}
          }

          // ======================================================================
          //  Layout editor
          // ======================================================================

          void Touch_EnterEditor(void)
          {
          	Touch_ReleaseAll();
          	editing = SDL_TRUE;
          	add_menu = SDL_FALSE;
          	selected = -1;
          	edit_ctx = CTX_RACE;
          }

          static void Touch_AddButton(int type)
          {
          	int c = edit_ctx;
          	if (nbtn[c] >= MAXBTN || type < 0 || type >= A_COUNT)
          		return;
          	btn[c][nbtn[c]].type = type;
          	btn[c][nbtn[c]].cx = 0.5f;
          	btn[c][nbtn[c]].cy = 0.5f;
          	selected = nbtn[c];
          	nbtn[c]++;
          }

          static void Touch_DeleteSelected(void)
          {
          	int i, c = edit_ctx;
          	if (selected < 0 || selected >= nbtn[c])
          		return;
          	for (i = selected; i < nbtn[c] - 1; i++)
          		btn[c][i] = btn[c][i + 1];
          	nbtn[c]--;
          	selected = -1;
          }

          static void Touch_ControlTapped(int c)
          {
          	switch (c)
          	{
          		case C_DONE:
          			editing = SDL_FALSE;
          			add_menu = SDL_FALSE;
          			selected = -1;
          			Touch_ReleaseAll();
          			Touch_Save();
          			break;
          		case C_CTX:     edit_ctx = (edit_ctx == CTX_RACE) ? CTX_MENU : CTX_RACE; selected = -1; add_menu = SDL_FALSE; break;
          		case C_RESET:   Touch_ResetContext(edit_ctx); selected = -1; add_menu = SDL_FALSE; break;
          		case C_SMALLER: ui_scale = Touch_Clamp(ui_scale - 0.1f, 0.5f, 1.8f); break;
          		case C_BIGGER:  ui_scale = Touch_Clamp(ui_scale + 0.1f, 0.5f, 1.8f); break;
          		case C_LESSOP:  ui_alpha = Touch_Clamp(ui_alpha - 0.1f, 0.15f, 1.0f); break;
          		case C_MOREOP:  ui_alpha = Touch_Clamp(ui_alpha + 0.1f, 0.15f, 1.0f); break;
          		case C_ADD:     add_menu = !add_menu; break;
          		case C_DEL:     Touch_DeleteSelected(); break;
          		case C_CANCEL:
          			armed_key = 0;
          			if (SDL_IsTextInputActive()) SDL_StopTextInput();
          			Touch_PostKey(KEY_ESCAPE, ev_keydown);
          			Touch_PostKey(KEY_ESCAPE, ev_keyup);
          			break;
          	}
          }

          // ======================================================================
          //  Finger events
          // ======================================================================

          void Touch_HandleFingerEvent(SDL_Renderer *renderer, const SDL_TouchFingerEvent *f, Uint32 type)
          {
          	int w = 0, h = 0, i, slot = -1, hit, ctx;
          	float px, py;

          	if (!renderer)
          		return;
          	SDL_GetRendererOutputSize(renderer, &w, &h);
          	if (w <= 0 || h <= 0)
          		return;
          	Touch_Layout(w, h);
          	Touch_UpdateTextInput();
          	ctx = Touch_CurrentContext();

          	px = f->x * (float)w;
          	py = f->y * (float)h;

          	for (i = 0; i < MAXFINGERS; i++)
          		if (fingers[i].used && fingers[i].id == f->fingerId)
          			slot = i;

          	if (type == SDL_FINGERDOWN)
          	{
          		hit = Touch_HitTest(px, py);
          		if (slot < 0)
          			for (i = 0; i < MAXFINGERS; i++)
          				if (!fingers[i].used) { slot = i; break; }

          		if (hit >= HIT_CHIP)
          		{
          			Touch_AddButton(hit - HIT_CHIP);
          			add_menu = SDL_FALSE;
          			return;
          		}
          		if (hit >= HIT_CTRL)
          		{
          			Touch_ControlTapped(hit - HIT_CTRL);
          			return;             // controls act on tap only
          		}
          		if (slot < 0)
          			return;
          		fingers[slot].used = SDL_TRUE;
          		fingers[slot].id = f->fingerId;
          		fingers[slot].btn = -1;
          		fingers[slot].drag = -1;

          		if (editing)
          		{
          			if (hit >= 0)
          			{
          				selected = hit;
          				fingers[slot].drag = hit;
          				fingers[slot].offx = btn[ctx][hit].x + btn[ctx][hit].w * 0.5f - px;
          				fingers[slot].offy = btn[ctx][hit].y + btn[ctx][hit].h * 0.5f - py;
          			}
          			else
          			{
          				selected = -1;
          				add_menu = SDL_FALSE;
          			}
          		}
          		else if (hit >= 0)
          		{
          			fingers[slot].btn = hit;
          			Touch_Press(ctx, hit);
          		}
          		else if (!typing && ctx == CTX_MENU)
          		{
          			// a tap on the menu itself
          			if (!menuactive && (gamestate == GS_TITLESCREEN || gamestate == GS_INTRO || gamestate == GS_CREDITS
          				|| gamestate == GS_CUTSCENE || gamestate == GS_EVALUATION || gamestate == GS_GAMEEND))
          			{
          				// intro / title / credits: a tap anywhere continues
          				Touch_PostKey(KEY_ENTER, ev_keydown);
          				Touch_PostKey(KEY_ENTER, ev_keyup);
          			}
          			else
          			{
          				// window pixels -> game screen pixels (the picture is scaled to fit and centered)
          				float sc = (float)w / (float)vid.width, sc2 = (float)h / (float)vid.height, lx, ly;
          				if (sc2 < sc) sc = sc2;
          				lx = (px - ((float)w - (float)vid.width * sc) * 0.5f) / sc;
          				ly = (py - ((float)h - (float)vid.height * sc) * 0.5f) / sc;
          				M_TouchTapAt((INT32)lx, (INT32)ly);
          			}
          			fingers[slot].used = SDL_FALSE;     // nothing to track
          		}
          	}
          	else if (type == SDL_FINGERMOTION)
          	{
          		if (slot < 0)
          			return;
          		if (editing)
          		{
          			int d = fingers[slot].drag;
          			if (d >= 0 && d < nbtn[ctx])
          			{
          				btn[ctx][d].cx = Touch_Clamp((px + fingers[slot].offx) / (float)w, 0.02f, 0.98f);
          				btn[ctx][d].cy = Touch_Clamp((py + fingers[slot].offy) / (float)h, 0.02f, 0.98f);
          			}
          			return;
          		}
          		hit = Touch_HitTest(px, py);
          		if (hit >= HIT_CTRL)
          			hit = -1;
          		if (fingers[slot].btn != hit)
          		{
          			Touch_Release(ctx, fingers[slot].btn);
          			fingers[slot].btn = hit;
          			Touch_Press(ctx, hit);
          		}
          	}
          	else if (type == SDL_FINGERUP)
          	{
          		if (slot < 0)
          			return;
          		Touch_Release(ctx, fingers[slot].btn);
          		fingers[slot].used = SDL_FALSE;
          		fingers[slot].btn = -1;
          		fingers[slot].drag = -1;
          	}
          }

          // ======================================================================
          //  Drawing (SRB2 style: flat grey translucent boxes, white text)
          // ======================================================================

          static void Touch_DrawArrow(SDL_Renderer *r, float x, float y, float w, float h, int arrow)
          {
          	float size = (w < h ? w : h) * 0.50f;
          	float cx = x + w * 0.5f, cy = y + h * 0.5f;
          	int i, n = (int)size;
          	for (i = 0; i < n; i++)
          	{
          		float t = (float)i / (float)n;          // 0 at the base, 1 at the tip
          		float len = size * 0.5f * (1.0f - t);
          		float pos = -size * 0.5f + t * size;
          		switch (arrow)
          		{
          			case 1: { SDL_Rect rc = { (int)(cx + size * 0.5f - t * size), (int)(cy - len), 2, (int)(len * 2) + 1 }; SDL_RenderFillRect(r, &rc); } break;
          			case 2: { SDL_Rect rc = { (int)(cx - size * 0.5f + t * size), (int)(cy - len), 2, (int)(len * 2) + 1 }; SDL_RenderFillRect(r, &rc); } break;
          			case 3: { SDL_Rect rc = { (int)(cx - len), (int)(cy + size * 0.5f - t * size), (int)(len * 2) + 1, 2 }; SDL_RenderFillRect(r, &rc); } break;
          			case 4: { SDL_Rect rc = { (int)(cx - len), (int)(cy - size * 0.5f + t * size), (int)(len * 2) + 1, 2 }; SDL_RenderFillRect(r, &rc); } break;
          		}
          		(void)pos;
          	}
          }

          // one SRB2-style button
          static int uniform_p = 0;      // label pixel size shared by all buttons of the layout (0 = fit each one)

          static void Touch_DrawBox(SDL_Renderer *r, const char *label, int arrow, float x, float y, float w, float h,
          	SDL_bool pressed, Uint8 tr, Uint8 tg, Uint8 tb, Uint8 fr, Uint8 fg, Uint8 fb, float alpha)
          {
          	SDL_Rect rc = { (int)x, (int)y, (int)w, (int)h };
          	Uint8 fa = (Uint8)(Touch_Clamp(alpha + (pressed ? 0.30f : 0.0f), 0.0f, 1.0f) * 255.0f);
          	Uint8 ta = (Uint8)(Touch_Clamp(alpha + 0.45f, 0.0f, 1.0f) * 255.0f);

          	SDL_SetRenderDrawColor(r, fr, fg, fb, fa);
          	SDL_RenderFillRect(r, &rc);
          	SDL_SetRenderDrawColor(r, 20, 20, 20, ta);          // dark edge (bottom/right) like the game's buttons
          	{
          		SDL_Rect e1 = { rc.x, rc.y + rc.h - 2, rc.w, 2 }, e2 = { rc.x + rc.w - 2, rc.y, 2, rc.h };
          		SDL_RenderFillRect(r, &e1);
          		SDL_RenderFillRect(r, &e2);
          	}
          	SDL_SetRenderDrawColor(r, 230, 230, 230, (Uint8)(ta * 0.6f));   // light edge (top/left)
          	{
          		SDL_Rect e1 = { rc.x, rc.y, rc.w, 2 }, e2 = { rc.x, rc.y, 2, rc.h };
          		SDL_RenderFillRect(r, &e1);
          		SDL_RenderFillRect(r, &e2);
          	}

          	if (arrow)
          	{
          		SDL_SetRenderDrawColor(r, tr, tg, tb, ta);
          		Touch_DrawArrow(r, x, y, w, h, arrow);
          	}
          	else if (label && label[0])
          	{
          		int len = (int)SDL_strlen(label);
          		int p = (int)(h * 0.34f / 7.0f);
          		int maxp = (int)(w * 0.86f / (float)(len * 6 - 1));
          		int tw;
          		if (p > maxp) p = maxp;
          		if (uniform_p > 0 && uniform_p < p) p = uniform_p;
          		if (p < 1) p = 1;
          		tw = Touch_TextWidth(label, p);
          		Touch_DrawText(r, label, (int)(x + (w - tw) * 0.5f), (int)(y + (h - 7 * p) * 0.5f), p, tr, tg, tb, ta);
          	}
          }

          static SDL_bool Touch_IsHeld(int ctx, int b)
          {
          	int i;
          	for (i = 0; i < MAXFINGERS; i++)
          		if (fingers[i].used && fingers[i].btn == b)
          			return ctx == Touch_CurrentContext();
          	return SDL_FALSE;
          }


          void Touch_Draw(SDL_Renderer *renderer)
          {
          	int w = 0, h = 0, i, lw = 0, lh = 0, ctx;
          	SDL_BlendMode oldblend;
          	Uint8 or_, og, ob, oa;

          	if (!renderer)
          		return;
          	SDL_GetRendererOutputSize(renderer, &w, &h);
          	if (w <= 0 || h <= 0)
          		return;

          	Touch_Layout(w, h);
          	Touch_UpdateTextInput();
          	ctx = Touch_CurrentContext();
          	if (ctx != last_ctx)
          	{
          		if (last_ctx >= 0)
          			Touch_ReleaseAll();         // a different layout: forget held buttons
          		last_ctx = ctx;
          	}

          	// one common label size: the largest that fits every text button
          	uniform_p = 0;
          	for (i = 0; i < nbtn[ctx]; i++)
          	{
          		const taction_t *a = &actions[btn[ctx][i].type];
          		if (!a->arrow)
          		{
          			int len = (int)SDL_strlen(a->label);
          			int p = (int)(btn[ctx][i].h * 0.34f / 7.0f);
          			int maxp = (int)(btn[ctx][i].w * 0.86f / (float)(len * 6 - 1));
          			if (p > maxp) p = maxp;
          			if (p < 1) p = 1;
          			if (uniform_p == 0 || p < uniform_p) uniform_p = p;
          		}
          	}

          	SDL_RenderGetLogicalSize(renderer, &lw, &lh);
          	SDL_RenderSetLogicalSize(renderer, 0, 0);
          	SDL_GetRenderDrawBlendMode(renderer, &oldblend);
          	SDL_GetRenderDrawColor(renderer, &or_, &og, &ob, &oa);
          	SDL_SetRenderDrawBlendMode(renderer, SDL_BLENDMODE_BLEND);

          	if (editing)
          	{
          		SDL_Rect all = { 0, 0, w, h };
          		SDL_SetRenderDrawColor(renderer, 0, 0, 0, 120);
          		SDL_RenderFillRect(renderer, &all);
          	}

          	if (typing && !editing)
          	{
          		// the Android keyboard is up: keep the screen clear, offer a way out
          		Touch_DrawBox(renderer, Touch_CtrlLabel(C_CANCEL), 0, ctrl[C_CANCEL].x, ctrl[C_CANCEL].y, ctrl[C_CANCEL].w, ctrl[C_CANCEL].h,
          			SDL_FALSE, 255, 255, 255, 110, 110, 110, ui_alpha + 0.2f);
          	}
          	else
          	{
          		for (i = 0; i < nbtn[ctx]; i++)
          		{
          			const taction_t *a = &actions[btn[ctx][i].type];
          			SDL_bool held = Touch_IsHeld(ctx, i);
          			Touch_DrawBox(renderer, a->label, a->arrow, btn[ctx][i].x, btn[ctx][i].y, btn[ctx][i].w, btn[ctx][i].h,
          				held, held ? 255 : 255, held ? 230 : 255, held ? 60 : 255, 105, 105, 105, ui_alpha);
          			if (editing && i == selected)
          			{
          				int k;
          				SDL_SetRenderDrawColor(renderer, 255, 230, 0, 255);
          				for (k = 0; k < 4; k++)
          				{
          					SDL_Rect sr = { (int)btn[ctx][i].x - k, (int)btn[ctx][i].y - k, (int)btn[ctx][i].w + 2 * k, (int)btn[ctx][i].h + 2 * k };
          					SDL_RenderDrawRect(renderer, &sr);
          				}
          			}
          		}
          	}

          	uniform_p = editing ? ctrl_p : 0;      // editor controls and palette: one common text size
          	if (editing)
          	{
          		char op[40];
          		for (i = 0; i < C_EDITCOUNT; i++)
          			Touch_DrawBox(renderer, Touch_CtrlLabel(i), 0, ctrl[i].x, ctrl[i].y, ctrl[i].w, ctrl[i].h,
          				SDL_FALSE, 255, 255, 255, 200, 120, 20, 0.85f);
          		if (add_menu)
          		{
          			for (i = 0; i < A_COUNT; i++)
          				Touch_DrawBox(renderer, actions[i].label, actions[i].arrow, chip[i].x, chip[i].y, chip[i].w, chip[i].h,
          					SDL_FALSE, 255, 255, 255, 105, 105, 105, 0.9f);
          		}
          		else
          		{
          			const char *hint = "DRAG A BUTTON TO MOVE IT";
          			int p = (int)((float)h * 0.0062f);
          			if (p < 1) p = 1;
          			Touch_DrawText(renderer, hint, (w - Touch_TextWidth(hint, p)) / 2, (int)((float)h * 0.34f), p, 255, 255, 255, 235);
          		}
          		SDL_snprintf(op, sizeof op, "SIZE %d%%  OPACITY %d%%", (int)(ui_scale * 100.0f + 0.5f), (int)(ui_alpha * 100.0f + 0.5f));
          		{
          			int p = (int)((float)h * 0.0062f);
          			if (p < 1) p = 1;
          			Touch_DrawText(renderer, op, (w - Touch_TextWidth(op, p)) / 2, (int)((float)h * 0.34f) + 11 * p, p, 255, 230, 60, 235);
          		}
          	}


          	SDL_SetRenderDrawColor(renderer, or_, og, ob, oa);
          	SDL_SetRenderDrawBlendMode(renderer, oldblend);
          	SDL_RenderSetLogicalSize(renderer, lw, lh);
          }

          // ======================================================================
          //  Test driver (only compiled into the PC test build)
          // ======================================================================


          #endif // TOUCH_UI
          END_OF_FILE_1

