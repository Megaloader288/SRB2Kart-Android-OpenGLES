          cat > "$WORK/overlay/i_crash.c" <<'END_OF_FILE_3'
          // Crash logger for Android: when the game dies from a signal (for example a mod that
          // triggers a memory error), write where it happened into the log file, then let the
          // game show its usual message. Open /sdcard/SRB2Kart/srb2kart-log.txt after a crash.
          #ifndef _GNU_SOURCE
          #define _GNU_SOURCE   // (dladdr on desktop libc; harmless on Android)
          #endif
          #include "../doomdef.h"

          #ifdef __ANDROID__
          #include <signal.h>
          #include <dlfcn.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <ucontext.h>
          #include <pthread.h>

          #ifndef CRASH_LIB_FILTER
          #define CRASH_LIB_FILTER "libmain"
          #endif

          extern FILE *logstream;

          static struct sigaction old_actions[NSIG];
          static volatile sig_atomic_t in_handler = 0;
          static uintptr_t stack_lo = 0, stack_hi = 0;   // stack of the game thread
          static const int crash_signals[] = { SIGSEGV, SIGBUS, SIGILL, SIGFPE, SIGABRT };

          static void Crash_Describe(FILE *f, const char *label, void *addr)
          {
          	Dl_info info;
          	if (addr && dladdr(addr, &info) && info.dli_fname)
          	{
          		const char *fn = strrchr(info.dli_fname, '/');
          		fn = fn ? fn + 1 : info.dli_fname;
          		fprintf(f, "  %-3s %p  %s+0x%lx  [%s+0x%lx]\n", label, addr,
          			info.dli_sname ? info.dli_sname : "?",
          			info.dli_sname ? (unsigned long)((char *)addr - (char *)info.dli_saddr) : 0UL,
          			fn, (unsigned long)((char *)addr - (char *)info.dli_fbase));
          	}
          	else
          		fprintf(f, "  %-3s %p\n", label, addr);
          }

          static void Crash_Handler(int sig, siginfo_t *si, void *ctx)
          {
          	ucontext_t *uc = (ucontext_t *)ctx;
          	FILE *f = logstream ? logstream : stderr;
          	void *pc = NULL, *lr = NULL;
          	uintptr_t *sp = NULL;
          	struct sigaction *old;
          	int i;

          	if (in_handler)
          		_exit(128 + sig);       // crashed again while reporting: give up
          	in_handler = 1;

          #if defined(__aarch64__)
          	pc = (void *)uc->uc_mcontext.pc;
          	lr = (void *)uc->uc_mcontext.regs[30];
          	sp = (uintptr_t *)uc->uc_mcontext.sp;
          #elif defined(__arm__)
          	pc = (void *)uc->uc_mcontext.arm_pc;
          	lr = (void *)uc->uc_mcontext.arm_lr;
          	sp = (uintptr_t *)uc->uc_mcontext.arm_sp;
          #elif defined(__x86_64__)
          	pc = (void *)uc->uc_mcontext.gregs[REG_RIP];
          	sp = (uintptr_t *)uc->uc_mcontext.gregs[REG_RSP];
          #endif

          	fprintf(f, "\n=== CRASH: signal %d (%s), code %d, address %p ===\n",
          		sig, strsignal(sig), si ? si->si_code : 0, si ? si->si_addr : NULL);
          	Crash_Describe(f, "PC", pc);
          	Crash_Describe(f, "LR", lr);
          	if (sp)
          	{
          		fprintf(f, "  game functions found on the stack (most recent first):\n");
          		int n = 0;
          		if ((uintptr_t)sp >= stack_lo && (uintptr_t)sp < stack_hi)
          		{
          			n = (int)((stack_hi - (uintptr_t)sp) / sizeof(uintptr_t));   // never read past the stack
          			if (n > 768)
          				n = 768;
          		}
          		for (i = 0; i < n; i++)
          		{
          			uintptr_t v = sp[i];
          			Dl_info info;
          			if (v > 0x10000 && dladdr((void *)v, &info) && info.dli_sname && info.dli_fname
          				&& strstr(info.dli_fname, CRASH_LIB_FILTER))
          				Crash_Describe(f, "..", (void *)v);
          		}
          	}
          	fprintf(f, "=== end of crash report ===\n");
          	fflush(f);

          	// hand over to the handler the game installed (it shows the message box)
          	old = &old_actions[sig];
          	if ((old->sa_flags & SA_SIGINFO) && old->sa_sigaction)
          		old->sa_sigaction(sig, si, ctx);
          	else if (old->sa_handler != SIG_DFL && old->sa_handler != SIG_IGN && old->sa_handler)
          		old->sa_handler(sig);
          	signal(sig, SIG_DFL);
          	raise(sig);
          }

          void Android_InstallCrashLogger(void)
          {
          	struct sigaction sa;
          	stack_t ss;
          	size_t i;
          	pthread_attr_t attr;
          	void *addr = NULL;
          	size_t size = 0;

          	if (pthread_getattr_np(pthread_self(), &attr) == 0)
          	{
          		if (pthread_attr_getstack(&attr, &addr, &size) == 0)
          		{
          			stack_lo = (uintptr_t)addr;
          			stack_hi = (uintptr_t)addr + size;
          		}
          		pthread_attr_destroy(&attr);
          	}

          	// a small private stack so that stack overflows can be reported too
          	ss.ss_sp = malloc(65536);
          	ss.ss_size = 65536;
          	ss.ss_flags = 0;
          	if (ss.ss_sp)
          		sigaltstack(&ss, NULL);

          	memset(&sa, 0, sizeof sa);
          	sa.sa_sigaction = Crash_Handler;
          	sa.sa_flags = SA_SIGINFO | SA_ONSTACK;
          	sigemptyset(&sa.sa_mask);
          	for (i = 0; i < sizeof crash_signals / sizeof crash_signals[0]; i++)
          		sigaction(crash_signals[i], &sa, &old_actions[crash_signals[i]]);
          }
