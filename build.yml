          static void Touch_ResetContext(int ctx)
          {
          	const tdef_t *d = ctx == CTX_RACE ? def_race : def_menu;
          	int n = ctx == CTX_RACE ? (int)(sizeof def_race / sizeof def_race[0]) : (int)(sizeof def_menu / sizeof def_menu[0]);
          	int i;
          	nbtn[ctx] = n;
          	for (i = 0; i < n; i++)
          	{
          		btn[ctx][i].type = d[i].type;
          		btn[ctx][i].cx = d[i].cx;
          		btn[ctx][i].cy = d[i].cy;
          	}
          }

          // ======================================================================
          //  State
          // ======================================================================

          #define HIT_CTRL 1000
          #define HIT_CHIP 2000

          #define MAXFINGERS 10
          static struct { SDL_FingerID id; int btn; int drag; float offx, offy; SDL_bool used; } fingers[MAXFINGERS];
          static int typecount[A_COUNT];
          static float ui_scale = 1.0f;
          static float ui_alpha = 0.55f;
          static SDL_bool editing = SDL_FALSE;
          static SDL_bool add_menu = SDL_FALSE;
          static SDL_bool inited = SDL_FALSE;
          static int edit_ctx = CTX_RACE;
          static int last_ctx = -1;
          static int selected = -1;
          static INT32 armed_key = 0;     // menu text field the player chose to type into
          static SDL_bool typing = SDL_FALSE;

          static float Touch_Clamp(float v, float lo, float hi)
          {
          	return v < lo ? lo : (v > hi ? hi : v);
          }

          // ======================================================================
          //  Saving / loading
          // ======================================================================

          static void Touch_Save(void)
          {
          	FILE *f = fopen(TOUCH_CFG_PATH, "w");
          	int c, i;
          	if (!f)
          		return;
          	fprintf(f, "SRB2KART_TOUCH 3\n");
          	fprintf(f, "scale %.3f\n", ui_scale);
          	fprintf(f, "alpha %.3f\n", ui_alpha);
          	for (c = 0; c < CTX_COUNT; c++)
          		for (i = 0; i < nbtn[c]; i++)
          			fprintf(f, "%s %d %.4f %.4f\n", c == CTX_RACE ? "race" : "menu", btn[c][i].type, btn[c][i].cx, btn[c][i].cy);
          	fclose(f);
          }

          static void Touch_Load(void)
          {
          	char line[128];
          	int seen[CTX_COUNT] = { 0, 0 };
          	FILE *f;

          	Touch_ResetContext(CTX_RACE);
          	Touch_ResetContext(CTX_MENU);
          	f = fopen(TOUCH_CFG_PATH, "r");
          	if (!f)
          		return;
          	if (!fgets(line, sizeof line, f) || strncmp(line, "SRB2KART_TOUCH 3", 16) != 0)
          	{
          		fclose(f);
          		return;     // older/unknown file: keep the defaults
          	}
          	while (fgets(line, sizeof line, f))
          	{
          		int t, c = -1;
          		float a, b;
          		if (sscanf(line, "scale %f", &a) == 1)
          			ui_scale = Touch_Clamp(a, 0.5f, 1.8f);
          		else if (sscanf(line, "alpha %f", &a) == 1)
          			ui_alpha = Touch_Clamp(a, 0.15f, 1.0f);
          		else if (sscanf(line, "race %d %f %f", &t, &a, &b) == 3)
          			c = CTX_RACE;
          		else if (sscanf(line, "menu %d %f %f", &t, &a, &b) == 3)
          			c = CTX_MENU;
          		if (c >= 0 && t >= 0 && t < A_COUNT)
          		{
          			if (!seen[c])
          				nbtn[c] = 0;
          			seen[c] = 1;
          			if (nbtn[c] < MAXBTN)
          			{
          				btn[c][nbtn[c]].type = t;
          				btn[c][nbtn[c]].cx = Touch_Clamp(a, 0.0f, 1.0f);
          				btn[c][nbtn[c]].cy = Touch_Clamp(b, 0.0f, 1.0f);
          				nbtn[c]++;
          			}
          		}
          	}
          	fclose(f);
          }

