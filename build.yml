          cat > "$WORK/overlay/PermissionActivity.java" <<'END_OF_FILE_8'
          package org.libsdl.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.File;
          import java.util.Arrays;

          /**
           * Launcher screen. Checks that the game can read its files from /sdcard/SRB2Kart
           * and starts the game when everything is in place. Otherwise it shows exactly
           * what is missing.
           */
          public class PermissionActivity extends Activity {

              private static final String DIR = "/sdcard/SRB2Kart";
              private static final String[] REQUIRED = {
                  "srb2.srb", "gfx.kart", "textures.kart", "chars.kart", "maps.kart"
              };
              private static final String[] OPTIONAL = { "sounds.kart", "music.kart" };

              private TextView text;
              private Button btnPerm;
              private Button btnRecheck;
              private Button btnStart;

              private boolean hasAccess() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      return Environment.isExternalStorageManager();
                  }
                  if (Build.VERSION.SDK_INT >= 23) {
                      return checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
                  }
                  return true;
              }

              private void askAccess() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                  Uri.parse("package:" + getPackageName())));
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                      }
                  } else if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[] {
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE }, 1);
                  }
              }

              private void startGame() {
                  startActivity(new Intent(this, KartActivity.class));
                  finish();
              }

              private boolean fileOk(File dir, String name) {
                  File f = new File(dir, name);
                  return f.isFile() && f.canRead() && f.length() > 0;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 40, 40, 40);

                  text = new TextView(this);
                  text.setTextSize(15);
                  root.addView(text);

                  btnPerm = new Button(this);
                  btnPerm.setText("Berikan izin akses file");
                  btnPerm.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { askAccess(); }
                  });
                  root.addView(btnPerm);

                  btnRecheck = new Button(this);
                  btnRecheck.setText("Periksa lagi");
                  btnRecheck.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { refresh(); }
                  });
                  root.addView(btnRecheck);

                  btnStart = new Button(this);
                  btnStart.setText("Jalankan game tetap");
                  btnStart.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { startGame(); }
                  });
                  root.addView(btnStart);

                  scroll.addView(root);
                  setContentView(scroll);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }

              private void refresh() {
                  boolean access = hasAccess();
                  File dir = new File(DIR);
                  if (access && !dir.exists()) {
                      dir.mkdirs();
                  }

                  boolean allRequired = true;
                  StringBuilder missing = new StringBuilder();
                  for (String name : REQUIRED) {
                      if (!fileOk(dir, name)) {
                          allRequired = false;
                          missing.append("  - ").append(name).append("\n");
                      }
                  }

                  if (access && allRequired) {
                      startGame();
                      return;
                  }

                  StringBuilder sb = new StringBuilder();
                  sb.append("Izin akses semua file: ").append(access ? "AKTIF" : "BELUM AKTIF").append("\n");
                  sb.append("Folder game: ").append(DIR).append("\n\n");

                  if (!access) {
                      sb.append("Ketuk 'Berikan izin akses file', aktifkan izinnya, lalu kembali ke sini.\n");
                  } else {
                      sb.append("File yang belum ditemukan:\n").append(missing).append("\n");
                      for (String name : OPTIONAL) {
                          if (!fileOk(dir, name)) {
                              sb.append("(opsional, belum ada: ").append(name).append(")\n");
                          }
                      }
                      String[] names = dir.list();
                      if (names == null) {
                          sb.append("\nFolder tidak bisa dibuka.\n");
                      } else {
                          Arrays.sort(names);
                          sb.append("\nIsi folder yang terlihat oleh game (").append(names.length).append("):\n");
                          int shown = 0;
                          for (String n : names) {
                              if (shown++ >= 40) {
                                  sb.append("  ...\n");
                                  break;
                              }
                              sb.append("  - ").append(n).append("\n");
                          }
                      }
                      sb.append("\nSalin file game LANGSUNG ke folder di atas (bukan ke subfolder), ");
                      sb.append("lalu ketuk 'Periksa lagi'.\n");
                  }

                  text.setText(sb.toString());
                  btnPerm.setVisibility(access ? View.GONE : View.VISIBLE);
                  btnRecheck.setVisibility(View.VISIBLE);
                  btnStart.setVisibility(access ? View.VISIBLE : View.GONE);
              }
          }
          END_OF_FILE_8

