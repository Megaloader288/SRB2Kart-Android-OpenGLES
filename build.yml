          // OpenGL ES 1.1 compatibility layer for SRB2Kart's OpenGL renderer (Android).
          //
          // The game's renderer (hardware/r_opengl/r_opengl.c) was written for desktop OpenGL 1.x.
          // Android only has OpenGL ES. ES 1.1 is almost the same fixed-function API, except for a few
          // functions that do not exist and a few stricter rules. This file fills those gaps.
          #include "../doomdef.h"

          #if defined (HAVE_SDL) && defined (HWRENDER) && defined (__ANDROID__)

          #include <string.h>
          #include <stdlib.h>
          #include <dlfcn.h>

          #include "SDL.h"
          #include "SDL_opengl.h"
          #include "../console.h"

          void *Gles1_GetProcAddress(const char *proc);
          int Gles1_SetAttributes(void);   // returns 0 if this GL mode cannot be used
          void Gles_PostContext(void);     // called right after the GL context exists

          #ifndef APIENTRY
          #define APIENTRY
          #endif

          #ifndef GLES2_GL4ES   // ---- OpenGL ES 1.1 (fixed function) ----

          // ---------------------------------------------------------------------------
          //  Finding the real OpenGL ES 1.1 functions
          // ---------------------------------------------------------------------------

          static void *es1lib = NULL;
          static int es1libtried = 0;

          static void *Es1_Real(const char *name)
          {
          	void *p = NULL;
          	if (!es1libtried)
          	{
          		es1libtried = 1;
          		es1lib = dlopen("libGLESv1_CM.so", RTLD_NOW | RTLD_LOCAL);
          	}
          	// Ask the ES 1.1 library itself first: eglGetProcAddress may hand out
          	// ES 2.0 entry points, which must not be used on an ES 1.1 context.
          	if (es1lib)
          		p = dlsym(es1lib, name);
          	if (!p)
          		p = SDL_GL_GetProcAddress(name);
          	return p;
          }

          // ---------------------------------------------------------------------------
          //  Replacements for desktop functions that ES 1.1 does not have, or that need adjusting
          // ---------------------------------------------------------------------------

          typedef void (APIENTRY *PFN_ClearDepthf)(GLclampf d);
          typedef void (APIENTRY *PFN_DepthRangef)(GLclampf n, GLclampf f);
          typedef void (APIENTRY *PFN_Color4ub)(GLubyte r, GLubyte g, GLubyte b, GLubyte a);
          typedef void (APIENTRY *PFN_TexImage2D)(GLenum target, GLint level, GLint internalformat, GLsizei w, GLsizei h,
          	GLint border, GLenum format, GLenum type, const GLvoid *pixels);
          typedef void (APIENTRY *PFN_DrawElements)(GLenum mode, GLsizei count, GLenum type, const GLvoid *indices);
          typedef void (APIENTRY *PFN_ReadPixels)(GLint x, GLint y, GLsizei w, GLsizei h, GLenum format, GLenum type, GLvoid *data);
          typedef const GLubyte *(APIENTRY *PFN_GetString)(GLenum name);

          static PFN_ClearDepthf   real_ClearDepthf;
          static PFN_DepthRangef   real_DepthRangef;
          static PFN_Color4ub      real_Color4ub;
          static PFN_TexImage2D    real_TexImage2D;
          static PFN_DrawElements  real_DrawElements;
          static PFN_ReadPixels    real_ReadPixels;
          static PFN_GetString     real_GetString;

          // desktop glClearDepth(double)  ->  ES glClearDepthf(float)
          static void APIENTRY Es1_ClearDepth(GLclampd d)
          {
          	if (!real_ClearDepthf)
          		real_ClearDepthf = (PFN_ClearDepthf)Es1_Real("glClearDepthf");
          	if (real_ClearDepthf)
          		real_ClearDepthf((GLclampf)d);
          }

          // desktop glDepthRange(double, double)  ->  ES glDepthRangef(float, float)
          static void APIENTRY Es1_DepthRange(GLclampd n, GLclampd f)
          {
          	if (!real_DepthRangef)
          		real_DepthRangef = (PFN_DepthRangef)Es1_Real("glDepthRangef");
          	if (real_DepthRangef)
          		real_DepthRangef((GLclampf)n, (GLclampf)f);
          }

          // glColor4ubv does not exist in ES
          static void APIENTRY Es1_Color4ubv(const GLubyte *v)
          {
          	if (!real_Color4ub)
          		real_Color4ub = (PFN_Color4ub)Es1_Real("glColor4ub");
          	if (real_Color4ub && v)
          		real_Color4ub(v[0], v[1], v[2], v[3]);
          }

          // ES wants the internal format to equal the format of the pixels you give it. The game gives RGBA
          // pixels and asks for a different internal format (RGB5_A1, luminance+alpha, alpha only).
          // Every such texture already stores the right values in its RGBA pixels, so plain RGBA is identical.
          static void APIENTRY Es1_TexImage2D(GLenum target, GLint level, GLint internalformat, GLsizei w, GLsizei h,
          	GLint border, GLenum format, GLenum type, const GLvoid *pixels)
          {
          	if (!real_TexImage2D)
          		real_TexImage2D = (PFN_TexImage2D)Es1_Real("glTexImage2D");
          	if (!real_TexImage2D)
          		return;
          	if (type == GL_UNSIGNED_BYTE)
          	{
          		if (format == GL_RGBA)
          			internalformat = GL_RGBA;
          		else if (format == GL_RGB)
          			internalformat = GL_RGB;
          	}
          	real_TexImage2D(target, level, internalformat, w, h, border, format, type, pixels);
          }

          // ES 1.1 only has 8 and 16 bit indices (32 bit needs an extension).
          static void APIENTRY Es1_DrawElements(GLenum mode, GLsizei count, GLenum type, const GLvoid *indices)
          {
          	static int haveuint = -1;
          	static GLushort *tmp = NULL;
          	static GLsizei tmpcount = 0;
          	static int warned = 0;
          	const GLuint *src;
          	GLsizei i;

          	if (!real_DrawElements)
          		real_DrawElements = (PFN_DrawElements)Es1_Real("glDrawElements");
          	if (!real_DrawElements)
          		return;

          	if (type != GL_UNSIGNED_INT)
          	{
          		real_DrawElements(mode, count, type, indices);
          		return;
          	}

          	if (haveuint < 0)
          	{
          		const char *ext = NULL;
          		if (!real_GetString)
          			real_GetString = (PFN_GetString)Es1_Real("glGetString");
          		if (real_GetString)
          			ext = (const char *)real_GetString(GL_EXTENSIONS);
          		haveuint = (ext && strstr(ext, "GL_OES_element_index_uint")) ? 1 : 0;
          	}
          	if (haveuint)
          	{
          		real_DrawElements(mode, count, type, indices);
          		return;
          	}

          	if (count <= 0 || !indices)
          		return;
          	if (count > tmpcount)
          	{
          		GLushort *n = (GLushort *)realloc(tmp, (size_t)count * sizeof (GLushort));
          		if (!n)
          			return;
          		tmp = n;
          		tmpcount = count;
          	}
          	src = (const GLuint *)indices;
          	for (i = 0; i < count; i++)
          	{
          		if (src[i] > 65535)
          		{
          			if (!warned)
          			{
          				warned = 1;
          				CONS_Printf("OpenGL ES 1.1: a batch uses more than 65535 vertices; skipping it.\n");
          			}
          			return;
          		}
          		tmp[i] = (GLushort)src[i];
          	}
          	real_DrawElements(mode, count, GL_UNSIGNED_SHORT, tmp);
          }

          // ES can only read back RGBA. The game asks for RGB (screenshots, GIFs).
          static void APIENTRY Es1_ReadPixels(GLint x, GLint y, GLsizei w, GLsizei h, GLenum format, GLenum type, GLvoid *data)
          {
          	if (!real_ReadPixels)
          		real_ReadPixels = (PFN_ReadPixels)Es1_Real("glReadPixels");
          	if (!real_ReadPixels)
          		return;

          	if (format == GL_RGB && type == GL_UNSIGNED_BYTE && data && w > 0 && h > 0)
          	{
          		GLubyte *rgba = (GLubyte *)malloc((size_t)w * (size_t)h * 4);
          		GLubyte *dst = (GLubyte *)data;
          		size_t i, n = (size_t)w * (size_t)h;
          		if (!rgba)
          			return;
          		real_ReadPixels(x, y, w, h, GL_RGBA, GL_UNSIGNED_BYTE, rgba);
          		for (i = 0; i < n; i++)
          		{
          			dst[i*3 + 0] = rgba[i*4 + 0];
          			dst[i*3 + 1] = rgba[i*4 + 1];
          			dst[i*3 + 2] = rgba[i*4 + 2];
          		}
          		free(rgba);
          		return;
          	}
          	real_ReadPixels(x, y, w, h, format, type, data);
          }

          // ---------------------------------------------------------------------------
          //  Entry points used by ogl_sdl.c
          // ---------------------------------------------------------------------------

          // Shader functions are ES 2.0 only. Report them as missing so the game never tries to use
          // shaders on this ES 1.1 context (eglGetProcAddress could otherwise hand out ES 2.0 pointers).
          static int Es1_IsShaderFunc(const char *p)
          {
          	static const char *const names[] = {
          		"glCreateShader", "glShaderSource", "glCompileShader", "glGetShaderiv", "glGetShaderInfoLog",
          		"glDeleteShader", "glCreateProgram", "glAttachShader", "glLinkProgram", "glGetProgramiv",
          		"glUseProgram", "glGetUniformLocation", NULL
          	};
          	int i;
          	if (strncmp(p, "glUniform", 9) == 0)
          		return 1;
          	for (i = 0; names[i]; i++)
          		if (strcmp(p, names[i]) == 0)
          			return 1;
          	return 0;
          }

          void *Gles1_GetProcAddress(const char *proc)
          {
          	if (Es1_IsShaderFunc(proc))
          		return NULL;
          	if (strcmp(proc, "glClearDepth") == 0)   return (void *)Es1_ClearDepth;
          	if (strcmp(proc, "glDepthRange") == 0)   return (void *)Es1_DepthRange;
          	if (strcmp(proc, "glColor4ubv") == 0)    return (void *)Es1_Color4ubv;
          	if (strcmp(proc, "glTexImage2D") == 0)   return (void *)Es1_TexImage2D;
          	if (strcmp(proc, "glDrawElements") == 0) return (void *)Es1_DrawElements;
          	if (strcmp(proc, "glReadPixels") == 0)   return (void *)Es1_ReadPixels;
          	return Es1_Real(proc);
          }

          // Must be called before SDL_GL_LoadLibrary and before the window is created.
          int Gles1_SetAttributes(void)
          {
          	SDL_GL_SetAttribute(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_ES);
          	SDL_GL_SetAttribute(SDL_GL_CONTEXT_MAJOR_VERSION, 1);
          	SDL_GL_SetAttribute(SDL_GL_CONTEXT_MINOR_VERSION, 1);
          	SDL_GL_SetAttribute(SDL_GL_RED_SIZE, 8);
          	SDL_GL_SetAttribute(SDL_GL_GREEN_SIZE, 8);
          	SDL_GL_SetAttribute(SDL_GL_BLUE_SIZE, 8);
          	SDL_GL_SetAttribute(SDL_GL_DEPTH_SIZE, 24);
          	return 1;
          }

          void Gles_PostContext(void)
          {
          }

          #else   // GLES2_GL4ES ---- OpenGL ES 2 through gl4es ----
          //
          // gl4es (libgl4es.so, built by the workflow) turns the game's desktop OpenGL calls into OpenGL ES 2
          // calls. It needs an ES 2 context made by SDL, and it must be started once that context exists.
          // That also gives the game's own GLSL shaders (software-style lighting) and 32-bit index batching.
          //

          static void *gl4es_lib = NULL;
          static int gl4es_tried = 0;

          static void *Gl4es_Lib(void)
          {
          	if (!gl4es_tried)
          	{
          		gl4es_tried = 1;
          		setenv("LIBGL_ES", "2", 1);
          		setenv("LIBGL_GLES", "libGLESv2.so", 0);
          		gl4es_lib = dlopen("libgl4es.so", RTLD_NOW | RTLD_LOCAL);
          		if (gl4es_lib)
          			CONS_Printf("OpenGL ES 2: gl4es loaded.\n");
          		else
          			CONS_Printf("OpenGL ES 2: could not load libgl4es.so (%s).\n", dlerror());
          	}
          	return gl4es_lib;
          }

          void *Gles1_GetProcAddress(const char *proc)
          {
          	void *lib = Gl4es_Lib();
          	return lib ? dlsym(lib, proc) : NULL;
          }

          int Gles1_SetAttributes(void)
          {
          	if (!Gl4es_Lib())
          		return 0;   // the game then falls back to the software renderer
          	SDL_GL_SetAttribute(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_ES);
          	SDL_GL_SetAttribute(SDL_GL_CONTEXT_MAJOR_VERSION, 2);
          	SDL_GL_SetAttribute(SDL_GL_CONTEXT_MINOR_VERSION, 0);
          	SDL_GL_SetAttribute(SDL_GL_RED_SIZE, 8);
          	SDL_GL_SetAttribute(SDL_GL_GREEN_SIZE, 8);
          	SDL_GL_SetAttribute(SDL_GL_BLUE_SIZE, 8);
          	SDL_GL_SetAttribute(SDL_GL_DEPTH_SIZE, 24);
          	return 1;
          }

          void Gles_PostContext(void)
          {
          	void *lib = Gl4es_Lib();
          	void (*set_gpa)(void *(*)(const char *)) = NULL;
          	void (*init)(void) = NULL;

          	if (!lib)
          		return;
          	*(void **)(&set_gpa) = dlsym(lib, "set_getprocaddress");
          	*(void **)(&init) = dlsym(lib, "initialize_gl4es");
          	if (set_gpa)
          		set_gpa(SDL_GL_GetProcAddress);
          	if (init)
          		init();
          	else
          		CONS_Printf("OpenGL ES 2: initialize_gl4es was not found in libgl4es.so.\n");
          }

          #endif // GLES2_GL4ES

          #endif // HAVE_SDL && HWRENDER && __ANDROID__
          END_OF_FILE_GL1

          cat > "$WORK/overlay/i_touchgl.c" <<'END_OF_FILE_GL2'
          // Draws the touchscreen controls when the game renders with OpenGL ES.
          // In software mode everything is passed straight to the normal SDL renderer.
          #include "../doomdef.h"

          #ifdef TOUCH_UI

          #include <stdlib.h>
          #include <string.h>
          #include "SDL.h"
          #include "i_touchgl.h"

          #if defined (HWRENDER) && defined (__ANDROID__)
          #include "SDL_opengl.h"
          #include "sdlmain.h"      // window

          extern void *Gles1_GetProcAddress(const char *proc);   // ogl_gles1.c
          #define GLPROC(name) Gles1_GetProcAddress(name)

          #ifndef APIENTRY
          #define APIENTRY
          #endif

          static int gl_marker;
          SDL_Renderer *Touch_GLRenderer(void)
          {
          	return (SDL_Renderer *)(void *)&gl_marker;
          }
          #define IS_GL(r) ((r) == (SDL_Renderer *)(void *)&gl_marker)

          // ---------- the rectangles collected during one frame ----------

          typedef struct { float x, y; } tvert_t;
          typedef struct { Uint8 r, g, b, a; } tcol_t;

          static tvert_t *verts = NULL;
          static tcol_t  *cols = NULL;
          static int nverts = 0, capverts = 0;
          static Uint8 cur[4] = { 255, 255, 255, 255 };
          static int gl_w = 0, gl_h = 0;

          static void AddRect(float x0, float y0, float x1, float y1)
          {
          	tvert_t *v;
          	tcol_t *c;
          	int i;

          	if (nverts + 6 > capverts)
          	{
          		int newcap = capverts ? capverts * 2 : 6 * 1024;
          		tvert_t *nv = (tvert_t *)realloc(verts, (size_t)newcap * sizeof (tvert_t));
          		tcol_t *nc;
          		if (!nv)
          			return;
          		verts = nv;
          		nc = (tcol_t *)realloc(cols, (size_t)newcap * sizeof (tcol_t));
          		if (!nc)
          			return;
          		cols = nc;
          		capverts = newcap;
          	}
          	v = verts + nverts;
          	c = cols + nverts;
          	v[0].x = x0; v[0].y = y0;
          	v[1].x = x1; v[1].y = y0;
          	v[2].x = x1; v[2].y = y1;
          	v[3].x = x0; v[3].y = y0;
          	v[4].x = x1; v[4].y = y1;
          	v[5].x = x0; v[5].y = y1;
          	for (i = 0; i < 6; i++)
          	{
          		c[i].r = cur[0]; c[i].g = cur[1]; c[i].b = cur[2]; c[i].a = cur[3];
          	}
          	nverts += 6;
          }

          // ---------- the few OpenGL ES 1.1 functions needed ----------

          typedef void (APIENTRY *PFN_Cap)(GLenum);
          typedef GLboolean (APIENTRY *PFN_IsEnabled)(GLenum);
          typedef void (APIENTRY *PFN_BlendFunc)(GLenum, GLenum);
          typedef void (APIENTRY *PFN_MatrixMode)(GLenum);
          typedef void (APIENTRY *PFN_Void)(void);
          typedef void (APIENTRY *PFN_Orthof)(GLfloat, GLfloat, GLfloat, GLfloat, GLfloat, GLfloat);
          typedef void (APIENTRY *PFN_Ortho)(GLdouble, GLdouble, GLdouble, GLdouble, GLdouble, GLdouble);
          typedef void (APIENTRY *PFN_Viewport)(GLint, GLint, GLsizei, GLsizei);
          typedef void (APIENTRY *PFN_Pointer)(GLint, GLenum, GLsizei, const GLvoid *);
          typedef void (APIENTRY *PFN_DrawArrays)(GLenum, GLint, GLsizei);

          static PFN_Cap p_Enable, p_Disable, p_EnableClient, p_DisableClient;
          static PFN_IsEnabled p_IsEnabled;
          static PFN_BlendFunc p_BlendFunc;
          static PFN_MatrixMode p_MatrixMode;
          static PFN_Void p_PushMatrix, p_PopMatrix, p_LoadIdentity;
          static PFN_Orthof p_Orthof;
          static PFN_Ortho p_Ortho;
          static PFN_Viewport p_Viewport;
          static PFN_Pointer p_VertexPointer, p_ColorPointer;
          static PFN_DrawArrays p_DrawArrays;
          static int gl_loaded = 0;   // 0 = not tried, 1 = ready, -1 = unavailable

          static int LoadGLFuncs(void)
          {
          	if (gl_loaded)
          		return gl_loaded > 0;
          	p_Enable        = (PFN_Cap)GLPROC("glEnable");
          	p_Disable       = (PFN_Cap)GLPROC("glDisable");
          	p_EnableClient  = (PFN_Cap)GLPROC("glEnableClientState");
          	p_DisableClient = (PFN_Cap)GLPROC("glDisableClientState");
          	p_IsEnabled     = (PFN_IsEnabled)GLPROC("glIsEnabled");
          	p_BlendFunc     = (PFN_BlendFunc)GLPROC("glBlendFunc");
          	p_MatrixMode    = (PFN_MatrixMode)GLPROC("glMatrixMode");
          	p_PushMatrix    = (PFN_Void)GLPROC("glPushMatrix");
          	p_PopMatrix     = (PFN_Void)GLPROC("glPopMatrix");
          	p_LoadIdentity  = (PFN_Void)GLPROC("glLoadIdentity");
          	p_Orthof        = (PFN_Orthof)GLPROC("glOrthof");
          	p_Ortho         = (PFN_Ortho)GLPROC("glOrtho");
          	p_Viewport      = (PFN_Viewport)GLPROC("glViewport");
          	p_VertexPointer = (PFN_Pointer)GLPROC("glVertexPointer");
          	p_ColorPointer  = (PFN_Pointer)GLPROC("glColorPointer");
          	p_DrawArrays    = (PFN_DrawArrays)GLPROC("glDrawArrays");
          	gl_loaded = (p_Enable && p_Disable && p_EnableClient && p_DisableClient && p_IsEnabled && p_BlendFunc
          		&& p_MatrixMode && p_PushMatrix && p_PopMatrix && p_LoadIdentity && (p_Orthof || p_Ortho) && p_Viewport
          		&& p_VertexPointer && p_ColorPointer && p_DrawArrays) ? 1 : -1;
          	return gl_loaded > 0;
          }

          #define NCAPS 7
          static const GLenum caps[NCAPS] = {
          	GL_TEXTURE_2D, GL_BLEND, GL_DEPTH_TEST, GL_CULL_FACE, GL_ALPHA_TEST, GL_FOG, GL_LIGHTING
          };
          #define NARRAYS 4
          static const GLenum arrays[NARRAYS] = {
          	GL_VERTEX_ARRAY, GL_COLOR_ARRAY, GL_TEXTURE_COORD_ARRAY, GL_NORMAL_ARRAY
          };

          static void FlushGL(void)
          {
          	GLboolean oldcap[NCAPS], oldarr[NARRAYS];
          	int i;

          	if (nverts <= 0 || gl_w <= 0 || gl_h <= 0)
          		return;
          	if (!LoadGLFuncs())
          	{
          		nverts = 0;
          		return;
          	}

          	for (i = 0; i < NCAPS; i++)
          		oldcap[i] = p_IsEnabled(caps[i]);
          	for (i = 0; i < NARRAYS; i++)
          		oldarr[i] = p_IsEnabled(arrays[i]);

          	p_Disable(GL_TEXTURE_2D);
          	p_Disable(GL_DEPTH_TEST);
          	p_Disable(GL_CULL_FACE);
          	p_Disable(GL_ALPHA_TEST);
          	p_Disable(GL_FOG);
          	p_Disable(GL_LIGHTING);
          	p_Enable(GL_BLEND);
          	p_BlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);

          	p_Viewport(0, 0, gl_w, gl_h);
          	p_MatrixMode(GL_PROJECTION);
          	p_PushMatrix();
          	p_LoadIdentity();
          	if (p_Orthof)
          		p_Orthof(0.0f, (GLfloat)gl_w, (GLfloat)gl_h, 0.0f, -1.0f, 1.0f);
          	else
          		p_Ortho(0.0, (double)gl_w, (double)gl_h, 0.0, -1.0, 1.0);
          	p_MatrixMode(GL_MODELVIEW);
          	p_PushMatrix();
          	p_LoadIdentity();

          	p_EnableClient(GL_VERTEX_ARRAY);
          	p_EnableClient(GL_COLOR_ARRAY);
          	p_DisableClient(GL_TEXTURE_COORD_ARRAY);
          	p_DisableClient(GL_NORMAL_ARRAY);
          	p_VertexPointer(2, GL_FLOAT, 0, verts);
          	p_ColorPointer(4, GL_UNSIGNED_BYTE, 0, cols);
          	p_DrawArrays(GL_TRIANGLES, 0, nverts);

          	p_MatrixMode(GL_MODELVIEW);
          	p_PopMatrix();
          	p_MatrixMode(GL_PROJECTION);
          	p_PopMatrix();
          	p_MatrixMode(GL_MODELVIEW);

          	for (i = 0; i < NARRAYS; i++)
          	{
          		if (oldarr[i]) p_EnableClient(arrays[i]);
          		else           p_DisableClient(arrays[i]);
          	}
          	for (i = 0; i < NCAPS; i++)
          	{
          		if (oldcap[i]) p_Enable(caps[i]);
          		else           p_Disable(caps[i]);
          	}
          	nverts = 0;
          }

          #else // not an OpenGL build: only the software renderer exists

          SDL_Renderer *Touch_GLRenderer(void) { return NULL; }
          #define IS_GL(r) (0)
          static void AddRect(float x0, float y0, float x1, float y1) { (void)x0; (void)y0; (void)x1; (void)y1; }
          static void FlushGL(void) {}
          static Uint8 cur[4] = { 255, 255, 255, 255 };
          static int gl_w = 0, gl_h = 0;
          #endif

          // ---------- the functions i_touch.c calls ----------

          void Touch_R_Begin(SDL_Renderer *r, int w, int h)
          {
          	if (!IS_GL(r))
          		return;
          #if defined (HWRENDER) && defined (__ANDROID__)
          	nverts = 0;
          #endif
          	gl_w = w;
          	gl_h = h;
          }

          void Touch_R_End(SDL_Renderer *r)
          {
          	if (IS_GL(r))
          		FlushGL();
          }

          int Touch_R_GetOutputSize(SDL_Renderer *r, int *w, int *h)
          {
          #if defined (HWRENDER) && defined (__ANDROID__)
          	if (IS_GL(r))
          	{
          		int ww = 0, hh = 0;
          		SDL_GL_GetDrawableSize(window, &ww, &hh);
          		if (w) *w = ww;
          		if (h) *h = hh;
          		return 0;
          	}
          #endif
          	return SDL_GetRendererOutputSize(r, w, h);
          }

          int Touch_R_SetColor(SDL_Renderer *r, Uint8 cr, Uint8 cg, Uint8 cb, Uint8 ca)
          {
          	if (IS_GL(r))
          	{
          		cur[0] = cr; cur[1] = cg; cur[2] = cb; cur[3] = ca;
          		return 0;
          	}
          	return SDL_SetRenderDrawColor(r, cr, cg, cb, ca);
          }

          int Touch_R_GetColor(SDL_Renderer *r, Uint8 *cr, Uint8 *cg, Uint8 *cb, Uint8 *ca)
          {
          	if (IS_GL(r))
          	{
          		if (cr) *cr = cur[0];
          		if (cg) *cg = cur[1];
          		if (cb) *cb = cur[2];
          		if (ca) *ca = cur[3];
          		return 0;
          	}
          	return SDL_GetRenderDrawColor(r, cr, cg, cb, ca);
          }

          int Touch_R_SetBlendMode(SDL_Renderer *r, SDL_BlendMode mode)
          {
          	if (IS_GL(r))
          		return 0;       // always alpha blending
          	return SDL_SetRenderDrawBlendMode(r, mode);
          }

          int Touch_R_GetBlendMode(SDL_Renderer *r, SDL_BlendMode *mode)
          {
          	if (IS_GL(r))
          	{
          		if (mode) *mode = SDL_BLENDMODE_BLEND;
          		return 0;
          	}
          	return SDL_GetRenderDrawBlendMode(r, mode);
          }

          void Touch_R_GetLogicalSize(SDL_Renderer *r, int *w, int *h)
          {
          	if (IS_GL(r))
          	{
          		if (w) *w = 0;
          		if (h) *h = 0;
          		return;
          	}
          	SDL_RenderGetLogicalSize(r, w, h);
          }

          int Touch_R_SetLogicalSize(SDL_Renderer *r, int w, int h)
          {
          	if (IS_GL(r))
          		return 0;
          	return SDL_RenderSetLogicalSize(r, w, h);
          }

          int Touch_R_FillRect(SDL_Renderer *r, const SDL_Rect *rc)
          {
          	if (IS_GL(r))
          	{
          		if (rc)
          			AddRect((float)rc->x, (float)rc->y, (float)(rc->x + rc->w), (float)(rc->y + rc->h));
          		else
          			AddRect(0.0f, 0.0f, (float)gl_w, (float)gl_h);
          		return 0;
          	}
          	return SDL_RenderFillRect(r, rc);
          }

          int Touch_R_DrawRect(SDL_Renderer *r, const SDL_Rect *rc)
          {
          	if (IS_GL(r))
          	{
          		float x0, y0, x1, y1;
          		if (rc)
          		{
          			x0 = (float)rc->x; y0 = (float)rc->y;
          			x1 = (float)(rc->x + rc->w); y1 = (float)(rc->y + rc->h);
          		}
          		else
          		{
          			x0 = 0.0f; y0 = 0.0f; x1 = (float)gl_w; y1 = (float)gl_h;
          		}
          		AddRect(x0, y0, x1, y0 + 1.0f);              // top
          		AddRect(x0, y1 - 1.0f, x1, y1);              // bottom
          		AddRect(x0, y0 + 1.0f, x0 + 1.0f, y1 - 1.0f); // left
          		AddRect(x1 - 1.0f, y0 + 1.0f, x1, y1 - 1.0f); // right
          		return 0;
          	}
          	return SDL_RenderDrawRect(r, rc);
          }

          #endif // TOUCH_UI
          END_OF_FILE_GL2

          cat > "$WORK/overlay/i_touchgl.h" <<'END_OF_FILE_GL3'
          // Lets the touchscreen controls (i_touch.c) draw either through an SDL renderer
          // (software mode) or straight into OpenGL ES (OpenGL mode).
          #ifndef __I_TOUCHGL_H__
          #define __I_TOUCHGL_H__

          #include "../doomdef.h"

          #ifdef TOUCH_UI
          #include "SDL.h"

          // A stand-in "renderer" handle meaning "draw with OpenGL ES".
          SDL_Renderer *Touch_GLRenderer(void);

          void Touch_R_Begin(SDL_Renderer *r, int w, int h);   // start collecting this frame's rectangles
          void Touch_R_End(SDL_Renderer *r);                   // draw everything collected (OpenGL only)

          int  Touch_R_GetOutputSize(SDL_Renderer *r, int *w, int *h);
          int  Touch_R_SetColor(SDL_Renderer *r, Uint8 cr, Uint8 cg, Uint8 cb, Uint8 ca);
          int  Touch_R_GetColor(SDL_Renderer *r, Uint8 *cr, Uint8 *cg, Uint8 *cb, Uint8 *ca);
          int  Touch_R_SetBlendMode(SDL_Renderer *r, SDL_BlendMode mode);
          int  Touch_R_GetBlendMode(SDL_Renderer *r, SDL_BlendMode *mode);
          void Touch_R_GetLogicalSize(SDL_Renderer *r, int *w, int *h);
          int  Touch_R_SetLogicalSize(SDL_Renderer *r, int w, int h);
          int  Touch_R_FillRect(SDL_Renderer *r, const SDL_Rect *rc);
          int  Touch_R_DrawRect(SDL_Renderer *r, const SDL_Rect *rc);

          #ifdef TOUCH_GL_REDIRECT
          // Only i_touch.c turns this on: its SDL drawing calls go through the functions above.
          #define SDL_GetRendererOutputSize  Touch_R_GetOutputSize
          #define SDL_SetRenderDrawColor     Touch_R_SetColor
          #define SDL_GetRenderDrawColor     Touch_R_GetColor
          #define SDL_SetRenderDrawBlendMode Touch_R_SetBlendMode
          #define SDL_GetRenderDrawBlendMode Touch_R_GetBlendMode
          #define SDL_RenderGetLogicalSize   Touch_R_GetLogicalSize
          #define SDL_RenderSetLogicalSize   Touch_R_SetLogicalSize
          #define SDL_RenderFillRect         Touch_R_FillRect
          #define SDL_RenderDrawRect         Touch_R_DrawRect
          #endif

          #endif // TOUCH_UI
          #endif
          END_OF_FILE_GL3

          cat > "$WORK/overlay/apply_gl_changes.py" <<'END_OF_FILE_GL4'
          #!/usr/bin/env python3
          # Adds the OpenGL (ES 1.1) renderer and 3D model support to the Android build.
          # Usage: apply_gl_changes.py <path to proj/app/jni> <path to the overlay folder> [es1|es2]
          import os
          import shutil
          import sys

          J = sys.argv[1]
          OV = sys.argv[2]
          MODE = sys.argv[3] if len(sys.argv) > 3 else "es1"   # "es1" = OpenGL ES 1.1, "es2" = OpenGL ES 2 via gl4es
          ES2 = (MODE == "es2")
          SRC = os.path.join(J, "src", "kart")
          failed = []


          def rd(path):
              with open(path, encoding="utf-8", errors="surrogateescape", newline="") as f:
                  return f.read()


          def wr(path, text):
              with open(path, "w", encoding="utf-8", errors="surrogateescape", newline="") as f:
                  f.write(text)


          def sub(path, old, new, what):
              s = rd(path)
              n = s.count(old)
              if n != 1:
                  print("PATCH FAILED (%s): expected 1 match, found %d" % (what, n))
                  failed.append(what)
                  return
              wr(path, s.replace(old, new))


          def ksub(rel, old, new, what):
              sub(os.path.join(SRC, rel), old, new, what)


          # ---------------------------------------------------------------- new files
          for name in ("ogl_gles1.c", "i_touchgl.c", "i_touchgl.h"):
              shutil.copy(os.path.join(OV, name), os.path.join(SRC, "sdl", name))

          # ------------------------------------------------- 3D model textures are PNGs
          ksub("hardware/hw_md2.c",
               '#include "../v_video.h"\n#ifdef HAVE_PNG\n',
               '#include "../v_video.h"\n#ifndef HAVE_PNG\n#define HAVE_PNG // model textures are PNG files; libpng is built into the app\n#endif\n#ifdef HAVE_PNG\n',
               "hw_md2.c: enable PNG model textures")

          # --------------------------------------------- OpenGL ES set-up (ogl_sdl.c)
          ksub("sdl/ogl_sdl.c",
               '#include "../m_argv.h"\n',
               '#include "../m_argv.h"\n'
               '#ifdef __ANDROID__\n'
               'void *Gles1_GetProcAddress(const char *proc);   // ogl_gles1.c\n'
               'int Gles1_SetAttributes(void);\n'
               'void Gles_PostContext(void);\n'
               '#ifdef TOUCH_UI\n'
               '#include "i_touch.h"\n'
               '#include "i_touchgl.h"\n'
               '#endif\n'
               '#endif\n',
               "ogl_sdl.c: declarations")

          ksub("sdl/ogl_sdl.c",
               '\treturn SDL_GL_GetProcAddress(proc);\n}\n',
               '#ifdef __ANDROID__\n\treturn Gles1_GetProcAddress(proc);\n#else\n\treturn SDL_GL_GetProcAddress(proc);\n#endif\n}\n',
               "ogl_sdl.c: GetGLFunc")

          ksub("sdl/ogl_sdl.c",
               '\tif (SDL_GL_LoadLibrary(OGLLibname) != 0)\n',
               '#ifdef __ANDROID__\n\tif (!Gles1_SetAttributes())   // ask for an OpenGL ES context\n\t\treturn 0;\n#endif\n\tif (SDL_GL_LoadLibrary(OGLLibname) != 0)\n',
               "ogl_sdl.c: request an OpenGL ES context")

          ksub("sdl/ogl_sdl.c",
               '\telse\n\t{\n\t\tCONS_Alert(CONS_ERROR, "Could not load GLU Library\\n");\n'
               '\t\tCONS_Printf("If you know what is the GLU library\'s name, use -GLUlib\\n");\n\t}\n',
               '#ifndef __ANDROID__ // Android has no GLU; the renderer works without it\n'
               '\telse\n\t{\n\t\tCONS_Alert(CONS_ERROR, "Could not load GLU Library\\n");\n'
               '\t\tCONS_Printf("If you know what is the GLU library\'s name, use -GLUlib\\n");\n\t}\n'
               '#endif\n',
               "ogl_sdl.c: no GLU on Android")

          ksub("sdl/ogl_sdl.c",
               '\tHWR_DrawScreenFinalTexture(sdlw, sdlh);\n\tSDL_GL_SwapWindow(window);\n',
               '\tHWR_DrawScreenFinalTexture(sdlw, sdlh);\n'
               '#if defined (__ANDROID__) && defined (TOUCH_UI)\n'
               '\tTouch_Draw(Touch_GLRenderer());   // on-screen buttons, drawn over the finished picture\n'
               '\tSetStates();                      // put the renderer\'s cached GL state back in order\n'
               '#endif\n'
               '\tSDL_GL_SwapWindow(window);\n',
               "ogl_sdl.c: draw touch buttons")

          # ------------------------------------------------------------- i_video.c
          ksub("sdl/i_video.c",
               '#include "i_touch.h"\n',
               '#include "i_touch.h"\n#include "i_touchgl.h"\n#ifdef __ANDROID__\nvoid Gles_PostContext(void);   // ogl_gles1.c\n#endif\n',
               "i_video.c: include")

          ksub("sdl/i_video.c",
               'Touch_HandleFingerEvent(renderer, &evt.tfinger, evt.type);',
               'Touch_HandleFingerEvent(rendermode == render_opengl ? Touch_GLRenderer() : renderer, &evt.tfinger, evt.type);',
               "i_video.c: finger events in OpenGL mode")

          ksub("sdl/i_video.c",
               '\t\t\trendermode = render_soft;\n\t\t\tCONS_Printf("Using default software renderer.\\n");\n',
               '#ifdef __ANDROID__\n'
               '\t\t\trendermode = render_opengl;   // falls back to software by itself if OpenGL ES cannot start\n'
               '\t\t\tCONS_Printf("Using default OpenGL renderer.\\n");\n'
               '#else\n'
               '\t\t\trendermode = render_soft;\n\t\t\tCONS_Printf("Using default software renderer.\\n");\n'
               '#endif\n',
               "i_video.c: OpenGL is the default")

          ksub("sdl/i_video.c",
               '\t\tif (sdlglcontext == NULL)\n\t\t{\n\t\t\tSDL_DestroyWindow(window);\n\t\t\tI_Error("Failed to create a GL context: %s\\n", SDL_GetError());\n\t\t}\n',
               '\t\tif (sdlglcontext == NULL)\n\t\t{\n'
               '#ifdef __ANDROID__\n'
               '\t\t\tCONS_Printf("Could not create an OpenGL ES context (%s). Using the software renderer.\\n", SDL_GetError());\n'
               '\t\t\tSDL_DestroyWindow(window);\n\t\t\twindow = NULL;\n\t\t\tSDL_GL_UnloadLibrary();\n\t\t\tSDL_GL_ResetAttributes();\n\t\t\trendermode = render_soft;\n'
               '\t\t\treturn Impl_CreateWindow(fullscreen);\n'
               '#else\n'
               '\t\t\tSDL_DestroyWindow(window);\n\t\t\tI_Error("Failed to create a GL context: %s\\n", SDL_GetError());\n'
               '#endif\n\t\t}\n',
               "i_video.c: fall back to software if there is no GL context")


          ksub("sdl/i_video.c",
               '\t\tSDL_GL_MakeCurrent(window, sdlglcontext);\n',
               '\t\tSDL_GL_MakeCurrent(window, sdlglcontext);\n#ifdef __ANDROID__\n\t\tGles_PostContext();   // starts gl4es in the ES 2 build; does nothing in the ES 1.1 build\n#endif\n',
               "i_video.c: start the GL layer once the context exists")

          # ----------------------------- the ES 1.1 build cannot batch (32-bit indices); gl4es can
          if not ES2:
              ksub("hardware/hw_main.c",
                   'consvar_t cv_grbatching = {"gr_batching", "On", 0, CV_OnOff, NULL, 0, NULL, NULL, 0, 0, NULL};\n',
                   '#ifdef __ANDROID__\n'
                   'consvar_t cv_grbatching = {"gr_batching", "Off", 0, CV_OnOff, NULL, 0, NULL, NULL, 0, 0, NULL};\n'
                   '#else\n'
                   'consvar_t cv_grbatching = {"gr_batching", "On", 0, CV_OnOff, NULL, 0, NULL, NULL, 0, 0, NULL};\n'
                   '#endif\n',
                   "hw_main.c: batching off on Android")


          # ------------- ES 2 build: if the game's shaders do not compile, carry on without them
          if ES2:
              ksub("hardware/r_opengl/r_opengl.c",
                   '#include "r_opengl.h"\n',
                   '#include "r_opengl.h"\n#include "../../console.h"\n',
                   "r_opengl.c: console")
              ksub("hardware/r_opengl/r_opengl.c",
                   'static boolean gl_allowshaders = false;\n',
                   'static boolean gl_allowshaders = false;\n'
                   '#define GLES2_SHADER_FAIL(...) do { CONS_Printf(__VA_ARGS__); CONS_Printf("\\n"); gl_allowshaders = false; return false; } while (0)\n',
                   "r_opengl.c: shader failure macro")
              path = os.path.join(SRC, "hardware/r_opengl/r_opengl.c")
              text = rd(path)
              n = text.count('I_Error("Hardware driver: Error ')
              if n != 5:
                  print("PATCH FAILED (r_opengl.c: expected 5 shader errors, found %d)" % n)
                  failed.append("r_opengl.c: shader errors")
              else:
                  wr(path, text.replace('I_Error("Hardware driver: Error ', 'GLES2_SHADER_FAIL("Hardware driver: Error '))

          # ------------------------------------------------ touch buttons in OpenGL mode
          ksub("sdl/i_touch.c",
               '#include "i_touch.h"\n',
               '#include "i_touch.h"\n#define TOUCH_GL_REDIRECT\n#include "i_touchgl.h"\n',
               "i_touch.c: include")

          ksub("sdl/i_touch.c",
               '\tSDL_RenderGetLogicalSize(renderer, &lw, &lh);\n',
               '\tTouch_R_Begin(renderer, w, h);\n\tSDL_RenderGetLogicalSize(renderer, &lw, &lh);\n',
               "i_touch.c: begin")

          ksub("sdl/i_touch.c",
               '\tSDL_RenderSetLogicalSize(renderer, lw, lh);\n',
               '\tTouch_R_End(renderer);\n\tSDL_RenderSetLogicalSize(renderer, lw, lh);\n',
               "i_touch.c: end")

          # ------------------------------------------- tell the log about the model files
          ksub("sdl/i_main.c",
               '\t\tfprintf(logstream, "  srb2.srb readable by the game: %s\\n", access("/sdcard/SRB2Kart/srb2.srb", R_OK) == 0 ? "yes" : "NO");\n',
               '\t\tfprintf(logstream, "  srb2.srb readable by the game: %s\\n", access("/sdcard/SRB2Kart/srb2.srb", R_OK) == 0 ? "yes" : "NO");\n'
               '\t\tfprintf(logstream, "  3D models: mdls.dat %s, mdls folder %s\\n",\n'
               '\t\t\taccess("/sdcard/SRB2Kart/mdls.dat", R_OK) == 0 ? "found" : "NOT found",\n'
               '\t\t\taccess("/sdcard/SRB2Kart/mdls", R_OK) == 0 ? "found" : "NOT found");\n',
               "i_main.c: log the model files")

          # --------------------------------------------------------- libpng + makefile
          png = os.path.join(J, "src", "libpng")
          prebuilt = os.path.join(png, "scripts", "pnglibconf.h.prebuilt")
          if not os.path.isfile(os.path.join(png, "png.c")) or not os.path.isfile(prebuilt):
              print("PATCH FAILED (libpng sources are missing in %s)" % png)
              failed.append("libpng")
          else:
              shutil.copy(prebuilt, os.path.join(png, "pnglibconf.h"))

          mk = os.path.join(J, "src", "Android.mk")
          sub(mk, "-DHAVE_THREADS -DHAVE_ZLIB \\\n", "-DHAVE_THREADS -DHAVE_ZLIB -DHWRENDER%s \\\n" % (" -DGLES2_GL4ES" if ES2 else ""), "Android.mk: HWRENDER")
          sub(mk, "    $(LOCAL_PATH)/kart/sdl\n\n", "    $(LOCAL_PATH)/kart/sdl \\\n    $(LOCAL_PATH)/libpng\n\n", "Android.mk: libpng include")
          sub(mk, "    kart/sdl/ogl_sdl.c \\\n",
              "    kart/sdl/ogl_sdl.c \\\n"
              "    kart/sdl/ogl_gles1.c \\\n"
              "    kart/sdl/i_touchgl.c \\\n"
              "    kart/hardware/hw_bsp.c \\\n"
              "    kart/hardware/hw_cache.c \\\n"
              "    kart/hardware/hw_clip.c \\\n"
              "    kart/hardware/hw_draw.c \\\n"
              "    kart/hardware/hw_light.c \\\n"
              "    kart/hardware/hw_main.c \\\n"
              "    kart/hardware/hw_md2.c \\\n"
              "    kart/hardware/hw_md2load.c \\\n"
              "    kart/hardware/hw_md3load.c \\\n"
              "    kart/hardware/hw_model.c \\\n"
              "    kart/hardware/hw_trick.c \\\n"
              "    kart/hardware/u_list.c \\\n"
              "    kart/hardware/r_opengl/r_opengl.c \\\n",
              "Android.mk: renderer sources")
          sub(mk, "LOCAL_SHARED_LIBRARIES := SDL2 SDL2_mixer\n",
              "LOCAL_SHARED_LIBRARIES := SDL2 SDL2_mixer\nLOCAL_STATIC_LIBRARIES := png\n",
              "Android.mk: link libpng")
          with open(mk, "a", newline="") as f:
              f.write(
                  "\n# libpng (reads the PNG textures of 3D models)\n"
                  "include $(CLEAR_VARS)\n"
                  "LOCAL_MODULE := png\n"
                  "LOCAL_C_INCLUDES := $(LOCAL_PATH)/libpng\n"
                  "LOCAL_CFLAGS := -DPNG_ARM_NEON_OPT=0 -w\n"
                  "LOCAL_SRC_FILES := \\\n"
                  "    libpng/png.c libpng/pngerror.c libpng/pngget.c libpng/pngmem.c libpng/pngpread.c \\\n"
                  "    libpng/pngread.c libpng/pngrio.c libpng/pngrtran.c libpng/pngrutil.c libpng/pngset.c \\\n"
                  "    libpng/pngtrans.c libpng/pngwio.c libpng/pngwrite.c libpng/pngwtran.c libpng/pngwutil.c\n"
                  "include $(BUILD_STATIC_LIBRARY)\n")

          if failed:
              print("OpenGL changes: %d patch(es) failed: %s" % (len(failed), ", ".join(failed)))
              sys.exit(1)
          print("OpenGL changes applied.")
          END_OF_FILE_GL4

