name: Build SRB2Kart Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Build the APK
        run: |
          set -ex
          export WORK="$PWD/work"
          mkdir -p "$WORK/overlay"
          cd "$WORK"

          # ---------- 1. Embedded files ----------
          cat > "$WORK/overlay/apply_android_changes.py" <<'END_OF_FILE_0'
          # Applies the Android changes to a fresh SRB2Kart source checkout.
          # Usage: python3 apply_android_changes.py <path to Kart-Public/src>
          import sys, os

          src = sys.argv[1]

          def sub(rel, old, new):
              path = os.path.join(src, rel)
              s = open(path, encoding="utf-8", errors="surrogateescape").read()
              if old not in s:
                  raise SystemExit("PATCH FAILED: text not found in %s:\n%s" % (rel, old[:120]))
              s = s.replace(old, new, 1)
              open(path, "w", encoding="utf-8", errors="surrogateescape").write(s)

          T = "\t"

          # 1) Fixes for builds without libcurl (the online server list needs curl)
          sub("d_clisrv.c",
              'va(M_GetText("%s downloading"), ((cl_mode == CL_DOWNLOADHTTPFILES) ? "\\x82""HTTP" : "\\x85""Direct")));',
              'va(M_GetText("%s downloading"),\n'
              '#ifdef HAVE_CURL\n'
              + T*4 + '((cl_mode == CL_DOWNLOADHTTPFILES) ? "\\x82""HTTP" : "\\x85""Direct")\n'
              '#else\n'
              + T*4 + '"\\x85""Direct"\n'
              '#endif\n'
              + T*4 + '));')

          sub("mserv.c",
              T*3 + 'Lock_state();\n' + T*3 + '{\n' + T*4 + 'different = ( MSId != MSRegisteredId );\n' + T*3 + '}\n' + T*3 + 'Unlock_state();',
              '#ifdef MASTERSERVER\n'
              + T*3 + 'Lock_state();\n' + T*3 + '{\n' + T*4 + 'different = ( MSId != MSRegisteredId );\n' + T*3 + '}\n' + T*3 + 'Unlock_state();\n'
              '#else\n' + T*3 + 'different = 0;\n#endif')

          sub("mserv.c",
              'static void MasterServer_OnChange(void)\n{',
              '#ifndef MASTERSERVER\n'
              '// Built without libcurl: no online server list, so these do nothing.\n'
              'void RegisterServer(void) {}\n'
              'void UnregisterServer(void) {}\n'
              'void MasterClient_Ticker(void) {}\n'
              '#endif\n\n'
              'static void MasterServer_OnChange(void)\n{')

          # 2) Touch controls
          sub("sdl/i_video.c",
              '#include "../d_main.h"',
              '#include "../d_main.h"\n#ifdef TOUCH_UI\n#include "i_touch.h"\n#endif')

          sub("sdl/i_video.c",
              T*3 + 'case SDL_MOUSEWHEEL:\n' + T*4 + 'Impl_HandleMouseWheelEvent(evt.wheel);\n' + T*4 + 'break;',
              T*3 + 'case SDL_MOUSEWHEEL:\n' + T*4 + 'Impl_HandleMouseWheelEvent(evt.wheel);\n' + T*4 + 'break;\n'
              '#ifdef TOUCH_UI\n'
              + T*3 + 'case SDL_TEXTINPUT:\n' + T*4 + 'Touch_TextInputEvent(evt.text.text);\n' + T*4 + 'break;\n'
              + T*3 + 'case SDL_FINGERDOWN:\n' + T*3 + 'case SDL_FINGERUP:\n' + T*3 + 'case SDL_FINGERMOTION:\n'
              + T*4 + 'Touch_HandleFingerEvent(renderer, &evt.tfinger, evt.type);\n' + T*4 + 'break;\n'
              '#endif')

          sub("sdl/i_video.c",
              T*2 + 'SDL_RenderClear(renderer);\n' + T*2 + 'SDL_RenderCopy(renderer, texture, &src_rect, NULL);\n' + T*2 + 'SDL_RenderPresent(renderer);',
              T*2 + 'SDL_RenderClear(renderer);\n' + T*2 + 'SDL_RenderCopy(renderer, texture, &src_rect, NULL);\n'
              '#ifdef TOUCH_UI\n' + T*2 + 'Touch_Draw(renderer);\n#endif\n'
              + T*2 + 'SDL_RenderPresent(renderer);')

          sub("sdl/i_video.c",
              T*2 + 'SDL_SetHint(SDL_HINT_RENDER_DRIVER, "opengl");',
              '#ifdef TOUCH_UI\n'
              + T*2 + '// Android has no desktop OpenGL; let SDL pick GLES. Touch must not act as a mouse.\n'
              + T*2 + 'SDL_SetHint(SDL_HINT_TOUCH_MOUSE_EVENTS, "0");\n'
              '#else\n' + T*2 + 'SDL_SetHint(SDL_HINT_RENDER_DRIVER, "opengl");\n#endif')

          # Android "back" button acts as Escape
          sub("sdl/i_video.c",
              T*2 + 'case SDL_SCANCODE_ESCAPE:         return KEY_ESCAPE;',
              T*2 + 'case SDL_SCANCODE_ESCAPE:         return KEY_ESCAPE;\n'
              '#ifdef __ANDROID__\n'
              + T*2 + 'case SDL_SCANCODE_AC_BACK:        return KEY_ESCAPE;\n'
              '#endif')

          # Fill the whole phone screen: pick an internal resolution with the same
          # shape (aspect ratio) as the display, so there are no black bars.
          sub("sdl/i_video.c",
              T + '//Impl_SetWindowName("SRB2Kart "VERSIONSTRING);',
              '#ifdef TOUCH_UI\n'
              + T + '{\n'
              + T*2 + 'int dw = 16, dh = 10;\n'
              + T*2 + 'SDL_DisplayMode dm;\n'
              + T*2 + 'if (window)\n'
              + T*3 + 'SDL_GetWindowSize(window, &dw, &dh);\n'
              + T*2 + 'else if (SDL_GetDesktopDisplayMode(0, &dm) == 0)\n'
              + T*2 + '{\n'
              + T*3 + 'dw = dm.w;\n'
              + T*3 + 'dh = dm.h;\n'
              + T*2 + '}\n'
              + '#ifdef TOUCH_UI_TEST\n'
              + T*2 + '{ const char *e = getenv("KART_TEST_DISPLAY"); if (e) sscanf(e, "%dx%d", &dw, &dh); }\n'
              + '#endif\n'
              + T*2 + 'if (dh > dw)\n'
              + T*2 + '{\n'
              + T*3 + 'int t = dw;\n'
              + T*3 + 'dw = dh;\n'
              + T*3 + 'dh = t;\n'
              + T*2 + '}\n'
              + T*2 + 'if (dw < 1 || dh < 1)\n'
              + T*2 + '{\n'
              + T*3 + 'dw = 16;\n'
              + T*3 + 'dh = 10;\n'
              + T*2 + '}\n'
              + T*2 + 'if (modeNum < 0 || modeNum >= MAXWINMODES)\n'
              + T*3 + 'vid.height = 400; // no mode chosen: sharp but light\n'
              + T*2 + 'if (vid.height < 200)\n' + T*3 + 'vid.height = 200;\n'
              + T*2 + 'if (vid.height > MAXVIDHEIGHT)\n' + T*3 + 'vid.height = MAXVIDHEIGHT;\n'
              + T*2 + 'vid.width = (vid.height * dw + dh / 2) / dh;\n'
              + T*2 + 'vid.width &= ~3;\n'
              + T*2 + 'if (vid.width < 320)\n'
              + T*3 + 'vid.width = 320;\n'
              + T*2 + 'if (vid.width > MAXVIDWIDTH)\n'
              + T*3 + 'vid.width = MAXVIDWIDTH;\n'
              + T + '}\n'
              '#endif\n'
              + T + '//Impl_SetWindowName("SRB2Kart "VERSIONSTRING);')

          # Mumble positional audio uses shm_open(), which Android does not have
          sub("sdl/i_system.c",
              '#ifdef __linux__ // need -lrt',
              '#if defined (__linux__) && !defined (__ANDROID__) // need -lrt')

          # 32-bit Android already defines off64_t differently; do not redefine it
          sub("m_misc.c",
              '#ifdef __linux__\n#ifndef _LARGEFILE64_SOURCE\ntypedef off_t off64_t;',
              '#if defined (__linux__) && !defined (__ANDROID__)\n#ifndef _LARGEFILE64_SOURCE\ntypedef off_t off64_t;')

          # Visible log file for troubleshooting (no PC needed): /sdcard/SRB2Kart/srb2kart-log.txt
          sub("sdl/i_main.c",
              T + 'logstream = fopen(logfilename, "wt");\n',
              '#ifdef __ANDROID__\n'
              + T + 'strcpy(logfilename, "/sdcard/SRB2Kart/srb2kart-log.txt");\n'
              '#endif\n'
              + T + 'logstream = fopen(logfilename, "wt");\n'
              '#ifdef __ANDROID__\n'
              + T + 'if (logstream)\n'
              + T*2 + 'setvbuf(logstream, NULL, _IOLBF, 0); // write every line at once, even if the game crashes\n'
              '#endif\n')

          # fork() is how the PC version watches for crashes; it breaks Android apps
          # (the child process has no SDL/Java threads and crashes, hiding the real error)
          sub("sdl/i_system.c",
              '#include <sys/wait.h>\n#define NEWSIGNALHANDLER\n#endif\n',
              '#include <sys/wait.h>\n#ifndef __ANDROID__\n#define NEWSIGNALHANDLER\n#endif\n#endif\n')

          # write what the game can see in /sdcard/SRB2Kart into the log (helps when files are not found)
          sub("sdl/i_main.c",
              T*2 + 'setvbuf(logstream, NULL, _IOLBF, 0); // write every line at once, even if the game crashes\n#endif\n',
              T*2 + 'setvbuf(logstream, NULL, _IOLBF, 0); // write every line at once, even if the game crashes\n#endif\n'
              '#ifdef __ANDROID__\n'
              + T + 'if (logstream)\n'
              + T + '{\n'
              + T*2 + 'DIR *d;\n'
              + T*2 + 'struct dirent *de;\n'
              + T*2 + 'fprintf(logstream, "Android: files the game can see in /sdcard/SRB2Kart:\\n");\n'
              + T*2 + 'd = opendir("/sdcard/SRB2Kart");\n'
              + T*2 + 'if (!d)\n'
              + T*3 + 'fprintf(logstream, "  cannot open the folder (errno %d)\\n", errno);\n'
              + T*2 + 'else\n'
              + T*2 + '{\n'
              + T*3 + 'while ((de = readdir(d)) != NULL)\n'
              + T*3 + '{\n'
              + T*4 + 'struct stat st;\n'
              + T*4 + 'char p[512];\n'
              + T*4 + 'snprintf(p, sizeof p, "/sdcard/SRB2Kart/%s", de->d_name);\n'
              + T*4 + 'if (stat(p, &st) == 0)\n'
              + T*5 + 'fprintf(logstream, "  %s  (%ld bytes)\\n", de->d_name, (long)st.st_size);\n'
              + T*4 + 'else\n'
              + T*5 + 'fprintf(logstream, "  %s  (stat failed, errno %d)\\n", de->d_name, errno);\n'
              + T*3 + '}\n'
              + T*3 + 'closedir(d);\n'
              + T*2 + '}\n'
              + T*2 + 'fprintf(logstream, "  srb2.srb readable by the game: %s\\n", access("/sdcard/SRB2Kart/srb2.srb", R_OK) == 0 ? "yes" : "NO");\n'
              + T + '}\n'
              '#endif\n')

          # The Android NDK build defines ANDROID, which activates an old hard-coded
          # home folder (/data/data/org.srb2/) that does not exist here. The app sets
          # $HOME to the game folder instead.
          sub("d_main.c",
              '#ifdef ANDROID\n' + T + 'return "/data/data/org.srb2/";\n#endif\n',
              '#if 0 // old Android path, replaced: the app sets $HOME\n' + T + 'return "/data/data/org.srb2/";\n#endif\n')

          # settings/saves folder: a normal (not hidden) name on Android
          sub("doomdef.h",
              '#define DEFAULTDIR ".srb2kart"\n',
              '#ifdef __ANDROID__\n#define DEFAULTDIR "kartdata"\n#else\n#define DEFAULTDIR ".srb2kart"\n#endif\n')


          def append(rel, text):
              path = os.path.join(src, rel)
              with open(path, "a", encoding="utf-8", errors="surrogateescape") as f:
                  f.write(text)

          # ---------- touch UI ----------
          sub("doomdef.h", "#define __DOOMDEF__\n",
              "#define __DOOMDEF__\n\n#ifdef __ANDROID__\n#define TOUCH_UI // on-screen touch controls\n#endif\n")

          # typed text: the Android keyboard sends text, not keys
          sub("sdl/i_video.c",
              T + 'event.data1 = Impl_SDL_Scancode_To_Keycode(evt.keysym.scancode);\n' + T + 'if (event.data1) D_PostEvent(&event);\n',
              T + 'event.data1 = Impl_SDL_Scancode_To_Keycode(evt.keysym.scancode);\n'
              '#ifdef TOUCH_UI\n' + T + 'if (Touch_SuppressKey(event.data1))\n' + T*2 + 'return;\n#endif\n'
              + T + 'if (event.data1) D_PostEvent(&event);\n')

          # remember where menu text is drawn (so touches can pick menu items)
          sub("v_video.h",
              "void V_DrawString(INT32 x, INT32 y, INT32 option, const char *string);",
              "void V_DrawString(INT32 x, INT32 y, INT32 option, const char *string);\n"
              "#ifdef TOUCH_UI\n"
              "#define V_TOUCHTEXTMAX 160\n"
              "typedef struct { char text[48]; INT32 x, y, w, h; } touchtext_t;\n"
              "extern touchtext_t v_touchtext[V_TOUCHTEXTMAX];\n"
              "extern INT32 v_numtouchtext;\n"
              "extern boolean v_recordtouchtext;\n"
              "#endif")

          sub("v_video.c",
              "void V_DrawString(INT32 x, INT32 y, INT32 option, const char *string)\n{\n",
              "#ifdef TOUCH_UI\n"
              "touchtext_t v_touchtext[V_TOUCHTEXTMAX];\n"
              "INT32 v_numtouchtext = 0;\n"
              "boolean v_recordtouchtext = false;\n"
              "\n"
              "static void V_TouchNoteText(INT32 x, INT32 y, INT32 option, const char *string, INT32 w, INT32 h)\n"
              "{\n"
              "\ttouchtext_t *t;\n"
              "\tINT32 dupx = vid.dupx, dupy = vid.dupy;\n"
              "\tif (!v_recordtouchtext || v_numtouchtext >= V_TOUCHTEXTMAX || !string || !string[0])\n"
              "\t\treturn;\n"
              "\tt = &v_touchtext[v_numtouchtext++];\n"
              "\tstrncpy(t->text, string, sizeof t->text - 1);\n"
              "\tt->text[sizeof t->text - 1] = '\\0';\n"
              "\tt->w = w * dupx;\n"
              "\tt->h = h * dupy;\n"
              "\tif (option & V_NOSCALESTART)\n"
              "\t{\n"
              "\t\tt->x = x;\n"
              "\t\tt->y = y;\n"
              "\t\treturn;\n"
              "\t}\n"
              "\tt->x = x * dupx;\n"
              "\tt->y = y * dupy;\n"
              "\tif (vid.width != BASEVIDWIDTH * dupx)\n"
              "\t{\n"
              "\t\tif (option & V_SNAPTORIGHT)\n"
              "\t\t\tt->x += vid.width - BASEVIDWIDTH * dupx;\n"
              "\t\telse if (!(option & V_SNAPTOLEFT))\n"
              "\t\t\tt->x += (vid.width - BASEVIDWIDTH * dupx) / 2;\n"
              "\t}\n"
              "\tif (vid.height != BASEVIDHEIGHT * dupy)\n"
              "\t{\n"
              "\t\tif (option & V_SNAPTOBOTTOM)\n"
              "\t\t\tt->y += vid.height - BASEVIDHEIGHT * dupy;\n"
              "\t\telse if (!(option & V_SNAPTOTOP))\n"
              "\t\t\tt->y += (vid.height - BASEVIDHEIGHT * dupy) / 2;\n"
              "\t}\n"
              "}\n"
              "#endif\n"
              "\n"
              "void V_DrawString(INT32 x, INT32 y, INT32 option, const char *string)\n{\n"
              "#ifdef TOUCH_UI\n\tV_TouchNoteText(x, y, option, string, V_StringWidth(string, option), 8);\n#endif\n")

          sub("v_video.c",
              "void V_DrawThinString(INT32 x, INT32 y, INT32 option, const char *string)\n{\n",
              "void V_DrawThinString(INT32 x, INT32 y, INT32 option, const char *string)\n{\n"
              "#ifdef TOUCH_UI\n\tV_TouchNoteText(x, y, option, string, V_ThinStringWidth(string, option), 8);\n#endif\n")

          # menu: record text while the menu draws itself
          sub("m_menu.c",
              T*3 + "M_GetGametypeColor();\n" + T*3 + "currentMenu->drawroutine(); // call current menu Draw routine\n",
              T*3 + "M_GetGametypeColor();\n"
              "#ifdef TOUCH_UI\n" + T*3 + "v_numtouchtext = 0;\n" + T*3 + "v_recordtouchtext = true;\n#endif\n"
              + T*3 + "currentMenu->drawroutine(); // call current menu Draw routine\n"
              "#ifdef TOUCH_UI\n" + T*3 + "v_recordtouchtext = false;\n#endif\n")

          # Options > Control Setup > Touch Controls...
          sub("m_menu.c",
              "static menuitem_t OP_ControlsMenu[] =\n{\n",
              "#ifdef TOUCH_UI\nstatic void M_TouchControlsEditor(INT32 choice);\n#endif\n\n"
              "static menuitem_t OP_ControlsMenu[] =\n{\n")
          sub("m_menu.c",
              '\t{IT_CALL | IT_STRING, NULL, "Player 4 Controls...", &M_Setup4PControlsMenu,  40},\n',
              '\t{IT_CALL | IT_STRING, NULL, "Player 4 Controls...", &M_Setup4PControlsMenu,  40},\n'
              '#ifdef TOUCH_UI\n\t{IT_CALL | IT_STRING, NULL, "Touch Controls...", M_TouchControlsEditor, 50},\n#endif\n')

          append("m_menu.c", r"""

          #ifdef TOUCH_UI
          // ---------------------------------------------------------------------------
          //  Touchscreen support (see sdl/i_touch.c)
          // ---------------------------------------------------------------------------
          extern void Touch_EnterEditor(void);
          extern void Touch_ArmTextInput(void);

          static void M_TouchControlsEditor(INT32 choice)
          {
          	(void)choice;
          	M_ClearMenus(true);
          	Touch_EnterEditor();
          }

          // Non-zero when the selected menu item takes typed text; the number identifies the item.
          INT32 M_TextInputKey(void)
          {
          	const menuitem_t *it;
          	INT32 id;
          	if (!menuactive || currentMenu == NULL || currentMenu->menuitems == NULL || currentMenu->numitems <= 0)
          		return 0;
          	if (itemOn < 0 || itemOn >= currentMenu->numitems)
          		return 0;
          	it = &currentMenu->menuitems[itemOn];
          	id = (INT32)(1 + itemOn + 64 * (INT32)(((size_t)currentMenu >> 4) & 0xFFFF));
          	if ((it->status & IT_TYPE) == IT_CVAR && (it->status & IT_CVARTYPE) == IT_CV_STRING)
          		return id;
          	if ((it->status & IT_TYPE) == IT_KEYHANDLER)
          	{
          #ifndef NONET
          		if (it->itemaction == (void *)M_HandleConnectIP)
          			return id;
          #endif
          		if (it->itemaction == (void *)M_HandleSetupMultiPlayer && itemOn == 0)
          			return id;
          	}
          	return 0;
          }

          static void M_TouchPostKey(INT32 key)
          {
          	event_t ev;
          	ev.data2 = ev.data3 = 0;
          	ev.data1 = key;
          	ev.type = ev_keydown;
          	D_PostEvent(&ev);
          	ev.type = ev_keyup;
          	D_PostEvent(&ev);
          }

          // A tap at (vx, vy) in game screen pixels: select the menu item whose text is there.
          // Tapping the already selected item activates it. Returns true if a menu item was hit.
          boolean M_TouchTapAt(INT32 vx, INT32 vy)
          {
          	INT32 n, i;
          	if (!menuactive || currentMenu == NULL || currentMenu->menuitems == NULL)
          		return false;

          	for (n = v_numtouchtext - 1; n >= 0; n--)
          	{
          		const touchtext_t *t = &v_touchtext[n];
          		INT32 padx = 6 * vid.dupx, pady = 3 * vid.dupy;

          		if (vx < t->x - padx || vx > t->x + t->w + padx || vy < t->y - pady || vy > t->y + t->h + pady)
          			continue;

          		for (i = 0; i < currentMenu->numitems; i++)
          		{
          			const menuitem_t *it = &currentMenu->menuitems[i];
          			if (!it->text || !it->text[0] || (it->status & IT_TYPE) == IT_SPACE)
          				continue;
          			if (strncmp(it->text, t->text, sizeof t->text - 1) != 0)
          				continue;

          			if (i != itemOn)
          			{
          				itemOn = (INT16)i;
          				S_StartSound(NULL, sfx_menu1);
          			}
          			else if (M_TextInputKey())
          				Touch_ArmTextInput();                  // start typing
          			else if ((it->status & IT_TYPE) == IT_CVAR)
          				M_TouchPostKey(KEY_RIGHTARROW);        // change the value
          			else
          				M_TouchPostKey(KEY_ENTER);             // open / run
          			return true;
          		}
          	}
          	return false;
          }
          #endif // TOUCH_UI
          """)


          # saved/default resolution: match by height only (the width follows the phone screen)
          sub("sdl/i_video.c",
              "INT32 VID_GetModeForSize(INT32 w, INT32 h)\n{\n\tint i;\n",
              "INT32 VID_GetModeForSize(INT32 w, INT32 h)\n{\n\tint i;\n"
              "#ifdef TOUCH_UI\n"
              "\t{\n"
              "\t\tint best = 0, bestd = 100000;\n"
              "\t\t(void)w;\n"
              "\t\tfor (i = 0; i < MAXWINMODES; i++)\n"
              "\t\t{\n"
              "\t\t\tint d = windowedModes[i][1] - h;\n"
              "\t\t\tif (d < 0)\n"
              "\t\t\t\td = -d;\n"
              "\t\t\tif (d < bestd)\n"
              "\t\t\t{\n"
              "\t\t\t\tbestd = d;\n"
              "\t\t\t\tbest = i;\n"
              "\t\t\t}\n"
              "\t\t}\n"
              "\t\treturn best;\n"
              "\t}\n"
              "#endif\n")

          sub("screen.c", '"scr_width", "1280"', '"scr_width", "640"')
          sub("screen.c", '"scr_height", "800"', '"scr_height", "400"')

          # 3) Android data folder + includes in the main file
          sub("sdl/i_main.c",
              '#ifdef HAVE_TTF\n#include "SDL.h"\n#include "i_ttf.h"\n#endif\n',
              '#ifdef HAVE_TTF\n#include "SDL.h"\n#include "i_ttf.h"\n#endif\n\n'
              '#ifdef __ANDROID__\n'
              '#include "SDL.h"       // renames main() to SDL_main(), which the Android launcher calls\n'
              '#include <sys/stat.h>\n#include <stdlib.h>\n#include <dirent.h>\n#include <errno.h>\n#endif\n')

          sub("sdl/i_main.c",
              T + 'myargv = argv; /// \\todo pull out path to exe from this string\n',
              T + 'myargv = argv; /// \\todo pull out path to exe from this string\n\n'
              '#ifdef __ANDROID__\n'
              + T + '// Game files live in /sdcard/SRB2Kart (put srb2.srb, *.kart, etc. there).\n'
              + T + '// Settings and saves go to /sdcard/SRB2Kart/.srb2kart\n'
              + T + 'setenv("SRB2WADDIR", "/sdcard/SRB2Kart", 1);\n'
              + T + 'setenv("HOME", "/sdcard/SRB2Kart", 1);\n'
              + T + 'mkdir("/sdcard/SRB2Kart", 0777);\n'
              + T + 'if (chdir("/sdcard/SRB2Kart") != 0)\n'
              + T*2 + 'SDL_Log("SRB2Kart: cannot open /sdcard/SRB2Kart");\n'
              '#endif\n')

          # crash logger (writes where the game crashed into the log file)
          sub("sdl/i_main.c", "#include <errno.h>\n#endif\n", "#include <errno.h>\nvoid Android_InstallCrashLogger(void);\n#endif\n")
          sub("sdl/i_main.c", T + "I_StartupSystem();\n",
              T + "I_StartupSystem();\n#ifdef __ANDROID__\n" + T + "Android_InstallCrashLogger(); // crash details go into the log file\n#endif\n")

          print("Android changes applied.")
          END_OF_FILE_0

          cat > "$WORK/overlay/i_touch.c" <<'END_OF_FILE_1'
          // Touchscreen controls for SRB2Kart on Android.
          //
          //  - Two button layouts: RACE (while driving) and MENU (menus, title, results).
          //  - Tapping menu text selects/activates it (the game records where menu text is drawn).
          //  - The Android keyboard appears whenever the game wants typed text
          //    (chat, console, player/server name, IP address ...).
          //  - Options > Control Setup > Touch Controls... opens the layout editor.
          #include "../doomdef.h"   // defines TOUCH_UI on Android; must come before the checks below

          #ifdef TOUCH_UI

          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include "SDL.h"
          #include "../doomdef.h"
          #include "../d_event.h"
          #include "../d_main.h"
          #include "../keys.h"
          #include "../doomstat.h"
          #include "../g_state.h"
          #include "../hu_stuff.h"
          #include "../console.h"
          #include "../screen.h"
          #include "../i_system.h"
          #include "../command.h"
          #include "../v_video.h"
          #include "../m_menu.h"
          #include "i_touch.h"

          #ifndef TOUCH_CFG_PATH
          #define TOUCH_CFG_PATH "/sdcard/SRB2Kart/touchlayout.cfg"
          #endif

          // provided by m_menu.c
          extern boolean M_TouchTapAt(INT32 vx, INT32 vy);
          extern INT32 M_TextInputKey(void);

          // ======================================================================
          //  Actions (what a button does)
          // ======================================================================

          typedef struct
          {
          	INT32 key;          // key sent to the game
          	const char *label;  // full word shown on the button
          	int arrow;          // 1=left 2=right 3=up 4=down (drawn instead of text)
          	float w, h;         // default size, in "button units"
          } taction_t;

          enum
          {
          	A_LEFT, A_RIGHT, A_UP, A_DOWN,
          	A_ACCEL, A_BRAKE, A_DRIFT, A_ITEM, A_LOOKBACK,
          	A_OK, A_BACK, A_MENU, A_PAUSE, A_SCORES, A_CHAT, A_CAMERA, A_CONSOLE, A_KEYBOARD,
          	A_COUNT
          };

          #define KEY_NONE 0

          static const taction_t actions[A_COUNT] =
          {
          	{ KEY_LEFTARROW,  "LEFT",        1, 1.20f, 1.20f },
          	{ KEY_RIGHTARROW, "RIGHT",       2, 1.20f, 1.20f },
          	{ KEY_UPARROW,    "UP",          3, 1.20f, 1.20f },
          	{ KEY_DOWNARROW,  "DOWN",        4, 1.20f, 1.20f },
          	{ 'a',            "ACCELERATE",  0, 2.20f, 1.50f },
          	{ 'd',            "BRAKE",       0, 1.70f, 1.10f },
          	{ 's',            "DRIFT",       0, 1.70f, 1.10f },
          	{ KEY_SPACE,      "USE ITEM",    0, 1.90f, 1.20f },
          	{ KEY_LSHIFT,     "LOOK BEHIND", 0, 2.30f, 0.90f },
          	{ KEY_ENTER,      "OK",          0, 1.90f, 1.40f },
          	{ KEY_ESCAPE,     "BACK",        0, 1.60f, 0.90f },
          	{ KEY_ESCAPE,     "MENU",        0, 1.40f, 0.80f },
          	{ KEY_PAUSE,      "PAUSE",       0, 1.40f, 0.80f },
          	{ KEY_TAB,        "SCORES",      0, 1.50f, 0.80f },
          	{ 't',            "CHAT",        0, 1.20f, 0.80f },
          	{ KEY_F12,        "CAMERA",      0, 1.50f, 0.80f },
          	{ KEY_CONSOLE,    "CONSOLE",     0, 1.60f, 0.80f },
          	{ KEY_NONE,       "KEYBOARD",    0, 1.80f, 0.80f },
          };

          // ======================================================================
          //  The buttons of each layout
          // ======================================================================

          typedef enum { CTX_RACE, CTX_MENU, CTX_COUNT } tctx_t;

          #define MAXBTN 24
          typedef struct { int type; float cx, cy; float x, y, w, h; } tbtn_t;

          static tbtn_t btn[CTX_COUNT][MAXBTN];
          static int nbtn[CTX_COUNT];

          typedef struct { int type; float cx, cy; } tdef_t;

          static const tdef_t def_race[] =
          {
          	// steering: bottom left (above the lap counter)
          	{ A_LEFT,     0.095f, 0.745f }, { A_RIGHT,    0.235f, 0.745f },
          	// pedals: bottom right; item to the left of the mini-map
          	{ A_ACCEL,    0.900f, 0.780f }, { A_ITEM,     0.755f, 0.440f },
          	{ A_DRIFT,    0.725f, 0.665f }, { A_BRAKE,    0.725f, 0.880f },
