          END_OF_FILE_11

          # ---------- 2. Get the sources (pinned versions) ----------
          git clone https://github.com/STJr/Kart-Public.git kart
          git -C kart checkout -q 44b4a6852858eebba5f9f50da2ac9f4b2889ad1a
          python3 overlay/apply_android_changes.py kart/src
          cp overlay/i_touch.c overlay/i_touch.h kart/src/sdl/

          curl -fsSL -o sdl2.tgz https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
          curl -fsSL -o mixer.tgz https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-2.8.0.tar.gz
          tar xzf sdl2.tgz
          tar xzf mixer.tgz

          # ---------- 3. Assemble the Android project ----------
          cp -r SDL2-2.30.9/android-project proj
          J=proj/app/jni
          mkdir -p $J/SDL $J/SDL_mixer $J/src/kart
          cp -r SDL2-2.30.9/include SDL2-2.30.9/src SDL2-2.30.9/Android.mk $J/SDL/
          cp -r SDL2_mixer-2.8.0/include SDL2_mixer-2.8.0/src SDL2_mixer-2.8.0/Android.mk $J/SDL_mixer/
          sed -i 's/SUPPORT_WAVPACK ?= true/SUPPORT_WAVPACK ?= false/' $J/SDL_mixer/Android.mk
          cp -r kart/src/. $J/src/kart/
          rm -rf $J/src/kart/Android.mk $J/src/kart/android $J/src/CMakeLists.txt $J/CMakeLists.txt
          cp overlay/Android.src.mk $J/src/Android.mk
          cp overlay/Application.mk $J/Application.mk
          cp overlay/app_build.gradle proj/app/build.gradle
          cp overlay/AndroidManifest.xml proj/app/src/main/AndroidManifest.xml
          cp overlay/KartActivity.java overlay/PermissionActivity.java proj/app/src/main/java/org/libsdl/app/
          sed -i 's|<string name="app_name">Game</string>|<string name="app_name">SRB2Kart</string>|' proj/app/src/main/res/values/strings.xml
          echo "org.gradle.jvmargs=-Xmx3g" >> proj/gradle.properties

          # app icon (replaces the default SDL logo)
          RES=proj/app/src/main/res
          rm -f $RES/mipmap-*/ic_launcher.png
          mkdir -p $RES/mipmap-xhdpi $RES/mipmap-xxxhdpi
          base64 -d overlay/ic_xhdpi.b64 > $RES/mipmap-xhdpi/ic_launcher.png
          base64 -d overlay/ic_xxxhdpi.b64 > $RES/mipmap-xxxhdpi/ic_launcher.png

          # ---------- 3b. Optional: libcurl for the online server list ----------
          if bash -e "$WORK/overlay/build_curl.sh" > "$WORK/curl-build.log" 2>&1; then
            printf 'CURL_PREFIX := %s\n' "$WORK/curl-prebuilt" > "$J/src/curl.mk"
            echo "libcurl built: online server list ENABLED"
            echo "### Online server list: ENABLED (libcurl built)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::libcurl build failed - building the APK WITHOUT the online server list"
            tail -n 40 "$WORK/curl-build.log" || true
            {
              echo "### Online server list: DISABLED (libcurl failed to build)"
              echo "The APK is still built. To get the server list, send this to Claude:"
              echo '```'
              grep -n -E "error|Error|CMake Error" "$WORK/curl-build.log" | head -25 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # ---------- 4. Build (64-bit + 32-bit; falls back to 64-bit only) ----------
          cd proj
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$WORK/build-both.log"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -eq 0 ]; then
            cp "$WORK/build-both.log" "$WORK/build.log"
            echo "### APK built for 64-bit AND 32-bit phones" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::64+32-bit build failed - retrying with 64-bit only"
            {
              echo "### 32-bit support FAILED - retrying 64-bit only. Errors from the first try:"
              echo '```'
              grep -n -E "error:|FAILED|What went wrong|undefined reference|fatal" "$WORK/build-both.log" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sed -i 's/arm64-v8a armeabi-v7a/arm64-v8a/' app/jni/Application.mk
            sed -i "s/abiFilters 'arm64-v8a', 'armeabi-v7a'/abiFilters 'arm64-v8a'/" app/build.gradle
            ./gradlew --no-daemon --stacktrace clean assembleDebug 2>&1 | tee "$WORK/build.log"
            STATUS=${PIPESTATUS[0]}
          fi
          set -e
          mkdir -p "$WORK/out"
          if [ "$STATUS" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "$WORK/out/SRB2Kart-debug.apk"
          fi
          exit $STATUS

      - name: Show errors (only if the build failed)
        if: failure()
        run: |
          {
            echo "## Build failed - copy the text below and send it to Claude"
            echo '```'
            grep -n -E "error:|FAILED|What went wrong|undefined reference|fatal" work/build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            work/build.log
            work/build-both.log
            work/curl-build.log
          if-no-files-found: ignore

      - name: Publish APK as a release (easy download on a phone)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" work/out/SRB2Kart-debug.apk \
            --repo "${{ github.repository }}" \
            --title "SRB2Kart Android build ${{ github.run_number }}" \
            --notes "Debug APK. Install it, then copy the game files to /sdcard/SRB2Kart."
