          cat > "$WORK/overlay/PermissionActivity.java" <<'END_OF_FILE_7'
          package org.libsdl.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Launcher screen. The game reads its files from /sdcard/SRB2Kart, so it needs
           * "all files access". Once granted, this screen starts the game.
           */
          public class PermissionActivity extends Activity {

              private boolean hasAccess() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      return Environment.isExternalStorageManager();
                  }
                  if (Build.VERSION.SDK_INT >= 23) {
                      return checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
                  }
                  return true;
              }

              private void askAccess() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                  Uri.parse("package:" + getPackageName())));
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                      }
                  } else if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[] {
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE }, 1);
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(48, 48, 48, 48);

                  TextView text = new TextView(this);
                  text.setTextSize(16);
                  text.setGravity(Gravity.CENTER);
                  text.setText("SRB2Kart butuh izin \"Akses semua file\" untuk membaca file game dari folder:\n\n"
                          + "/sdcard/SRB2Kart\n\n"
                          + "Ketuk tombol di bawah, aktifkan izinnya, lalu kembali ke aplikasi ini.");
                  root.addView(text);

                  Button button = new Button(this);
                  button.setText("Berikan izin");
                  button.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { askAccess(); }
                  });
                  root.addView(button);

                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (hasAccess()) {
                      startActivity(new Intent(this, KartActivity.class));
                      finish();
                  }
              }
          }
          END_OF_FILE_7

