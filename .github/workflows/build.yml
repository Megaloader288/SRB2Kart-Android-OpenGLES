                  tasks["merge${variant.name.capitalize()}Assets"]
                      .dependsOn("externalNativeBuild${variant.name.capitalize()}")
              }
              sourceSets.main {
                  jniLibs.srcDir 'libs'
              }
              externalNativeBuild {
                  ndkBuild {
                      path 'jni/Android.mk'
                  }
              }
              lint {
                  abortOnError false
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
          }
          END_OF_FILE_8

          cat > "$WORK/overlay/build_curl.sh" <<'END_OF_FILE_9'
          #!/bin/bash
          # Builds libcurl (HTTPS through mbedTLS) for Android: 64-bit and 32-bit ARM.
          # Result: $WORK/curl-prebuilt/<abi>/ (include/ and lib/)
          set -ex
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"
          mkdir -p "$WORK/curlbuild"
          cd "$WORK/curlbuild"

          curl -fsSL -o mbedtls.tar.bz2 https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.2/mbedtls-3.6.2.tar.bz2
          curl -fsSL -o curl.tar.xz https://github.com/curl/curl/releases/download/curl-8_10_1/curl-8.10.1.tar.xz
          tar xjf mbedtls.tar.bz2
          tar xJf curl.tar.xz

          for ABI in arm64-v8a armeabi-v7a; do
            PRE="$WORK/curl-prebuilt/$ABI"
            mkdir -p "$PRE"
            COMMON="-DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON"

            cmake -S mbedtls-3.6.2 -B "mbed-build-$ABI" $COMMON \
              -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
              -DUSE_SHARED_MBEDTLS_LIBRARY=OFF -DUSE_STATIC_MBEDTLS_LIBRARY=ON \
              -DMBEDTLS_FATAL_WARNINGS=OFF \
              -DCMAKE_INSTALL_PREFIX="$PRE"
            cmake --build "mbed-build-$ABI" -j"$(nproc)"
            cmake --install "mbed-build-$ABI"

            cmake -S curl-8.10.1 -B "curl-build-$ABI" $COMMON \
              -DCMAKE_FIND_ROOT_PATH="$PRE" \
              -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON -DBUILD_CURL_EXE=OFF -DBUILD_TESTING=OFF \
              -DCURL_USE_MBEDTLS=ON -DCURL_USE_OPENSSL=OFF \
              -DMBEDTLS_INCLUDE_DIR="$PRE/include" \
              -DMBEDTLS_LIBRARY="$PRE/lib/libmbedtls.a" \
              -DMBEDX509_LIBRARY="$PRE/lib/libmbedx509.a" \
              -DMBEDCRYPTO_LIBRARY="$PRE/lib/libmbedcrypto.a" \
              -DCURL_CA_PATH=/system/etc/security/cacerts -DCURL_CA_BUNDLE=none \
              -DCURL_DISABLE_LDAP=ON -DCURL_DISABLE_LDAPS=ON \
              -DUSE_LIBIDN2=OFF -DCURL_USE_LIBPSL=OFF -DCURL_USE_LIBSSH2=OFF -DCURL_USE_LIBSSH=OFF \
              -DUSE_NGHTTP2=OFF -DCURL_BROTLI=OFF -DCURL_ZSTD=OFF -DCURL_ZLIB=OFF \
              -DENABLE_CURL_MANUAL=OFF \
              -DCMAKE_INSTALL_PREFIX="$PRE"
            cmake --build "curl-build-$ABI" -j"$(nproc)"
            cmake --install "curl-build-$ABI"

            test -f "$PRE/lib/libcurl.a"
            test -f "$PRE/lib/libmbedtls.a"
            test -f "$PRE/lib/libmbedx509.a"
            test -f "$PRE/lib/libmbedcrypto.a"
            test -f "$PRE/include/curl/curl.h"
          done
          echo "libcurl for Android (arm64 + arm32) is ready"
          END_OF_FILE_9

          cat > "$WORK/overlay/ic_xhdpi.b64" <<'END_OF_FILE_10'
