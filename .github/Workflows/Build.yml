name: Build SRB2Kart Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Build the APK
        run: |
          set -ex
          export WORK="$PWD/work"
          mkdir -p "$WORK/overlay"
          cd "$WORK"

          # ---------- 1. Embedded files ----------
          cat > "$WORK/overlay/apply_android_changes.py" <<'END_OF_FILE_0'
          # Applies the Android changes to a fresh SRB2Kart source checkout.
          # Usage: python3 apply_android_changes.py <path to Kart-Public/src>
          import sys, os

          src = sys.argv[1]

          def sub(rel, old, new):
              path = os.path.join(src, rel)
              s = open(path, encoding="utf-8", errors="surrogateescape").read()
              if old not in s:
                  raise SystemExit("PATCH FAILED: text not found in %s:\n%s" % (rel, old[:120]))
              s = s.replace(old, new, 1)
              open(path, "w", encoding="utf-8", errors="surrogateescape").write(s)

          T = "\t"

          # 1) Fixes for builds without libcurl (the online server list needs curl)
          sub("d_clisrv.c",
              'va(M_GetText("%s downloading"), ((cl_mode == CL_DOWNLOADHTTPFILES) ? "\\x82""HTTP" : "\\x85""Direct")));',
              'va(M_GetText("%s downloading"),\n'
              '#ifdef HAVE_CURL\n'
              + T*4 + '((cl_mode == CL_DOWNLOADHTTPFILES) ? "\\x82""HTTP" : "\\x85""Direct")\n'
              '#else\n'
              + T*4 + '"\\x85""Direct"\n'
              '#endif\n'
              + T*4 + '));')

          sub("mserv.c",
              T*3 + 'Lock_state();\n' + T*3 + '{\n' + T*4 + 'different = ( MSId != MSRegisteredId );\n' + T*3 + '}\n' + T*3 + 'Unlock_state();',
              '#ifdef MASTERSERVER\n'
              + T*3 + 'Lock_state();\n' + T*3 + '{\n' + T*4 + 'different = ( MSId != MSRegisteredId );\n' + T*3 + '}\n' + T*3 + 'Unlock_state();\n'
              '#else\n' + T*3 + 'different = 0;\n#endif')

          sub("mserv.c",
              'static void MasterServer_OnChange(void)\n{',
              '#ifndef MASTERSERVER\n'
              '// Built without libcurl: no online server list, so these do nothing.\n'
              'void RegisterServer(void) {}\n'
              'void UnregisterServer(void) {}\n'
              'void MasterClient_Ticker(void) {}\n'
              '#endif\n\n'
              'static void MasterServer_OnChange(void)\n{')

          # 2) Touch controls
          sub("sdl/i_video.c",
              '#include "../d_main.h"',
              '#include "../d_main.h"\n#ifdef __ANDROID__\n#include "i_touch.h"\n#endif')

          sub("sdl/i_video.c",
              T*3 + 'case SDL_MOUSEWHEEL:\n' + T*4 + 'Impl_HandleMouseWheelEvent(evt.wheel);\n' + T*4 + 'break;',
              T*3 + 'case SDL_MOUSEWHEEL:\n' + T*4 + 'Impl_HandleMouseWheelEvent(evt.wheel);\n' + T*4 + 'break;\n'
              '#ifdef __ANDROID__\n'
              + T*3 + 'case SDL_FINGERDOWN:\n' + T*3 + 'case SDL_FINGERUP:\n' + T*3 + 'case SDL_FINGERMOTION:\n'
              + T*4 + 'Touch_HandleFingerEvent(renderer, &evt.tfinger, evt.type);\n' + T*4 + 'break;\n'
              '#endif')

          sub("sdl/i_video.c",
              T*2 + 'SDL_RenderClear(renderer);\n' + T*2 + 'SDL_RenderCopy(renderer, texture, &src_rect, NULL);\n' + T*2 + 'SDL_RenderPresent(renderer);',
              T*2 + 'SDL_RenderClear(renderer);\n' + T*2 + 'SDL_RenderCopy(renderer, texture, &src_rect, NULL);\n'
              '#ifdef __ANDROID__\n' + T*2 + 'Touch_Draw(renderer);\n#endif\n'
              + T*2 + 'SDL_RenderPresent(renderer);')

          sub("sdl/i_video.c",
              T*2 + 'SDL_SetHint(SDL_HINT_RENDER_DRIVER, "opengl");',
              '#ifdef __ANDROID__\n'
              + T*2 + '// Android has no desktop OpenGL; let SDL pick GLES. Touch must not act as a mouse.\n'
              + T*2 + 'SDL_SetHint(SDL_HINT_TOUCH_MOUSE_EVENTS, "0");\n'
              '#else\n' + T*2 + 'SDL_SetHint(SDL_HINT_RENDER_DRIVER, "opengl");\n#endif')

          # Android "back" button acts as Escape
          sub("sdl/i_video.c",
              T*2 + 'case SDL_SCANCODE_ESCAPE:         return KEY_ESCAPE;',
              T*2 + 'case SDL_SCANCODE_ESCAPE:         return KEY_ESCAPE;\n'
              '#ifdef __ANDROID__\n'
              + T*2 + 'case SDL_SCANCODE_AC_BACK:        return KEY_ESCAPE;\n'
              '#endif')

          # 3) Android data folder + includes in the main file
          sub("sdl/i_main.c",
              '#ifdef HAVE_TTF\n#include "SDL.h"\n#include "i_ttf.h"\n#endif\n',
              '#ifdef HAVE_TTF\n#include "SDL.h"\n#include "i_ttf.h"\n#endif\n\n'
              '#ifdef __ANDROID__\n'
              '#include "SDL.h"       // renames main() to SDL_main(), which the Android launcher calls\n'
              '#include <sys/stat.h>\n#include <stdlib.h>\n#endif\n')

          sub("sdl/i_main.c",
              T + 'myargv = argv; /// \\todo pull out path to exe from this string\n',
              T + 'myargv = argv; /// \\todo pull out path to exe from this string\n\n'
              '#ifdef __ANDROID__\n'
              + T + '// Game files live in /sdcard/SRB2Kart (put srb2.srb, *.kart, etc. there).\n'
              + T + '// Settings and saves go to /sdcard/SRB2Kart/.srb2kart\n'
              + T + 'setenv("SRB2WADDIR", "/sdcard/SRB2Kart", 1);\n'
              + T + 'setenv("HOME", "/sdcard/SRB2Kart", 1);\n'
              + T + 'mkdir("/sdcard/SRB2Kart", 0777);\n'
              + T + 'if (chdir("/sdcard/SRB2Kart") != 0)\n'
              + T*2 + 'SDL_Log("SRB2Kart: cannot open /sdcard/SRB2Kart");\n'
              '#endif\n')

          print("Android changes applied.")
          END_OF_FILE_0

          cat > "$WORK/overlay/i_touch.c" <<'END_OF_FILE_1'
          // Touchscreen overlay for SRB2Kart on Android.
          // Draws on-screen buttons and turns finger input into key events.
          #ifdef __ANDROID__

          #include "SDL.h"
          #include "../doomdef.h"
          #include "../d_event.h"
          #include "../d_main.h"
          #include "../keys.h"
          #include "i_touch.h"

          typedef struct
          {
          	INT32 key;          // key posted to the game
          	const char *label;  // short text on the button
          	float x, y, w, h;   // position/size in window pixels (set by layout)
          	Uint8 r, g, b;      // color
          	int arrow;          // 0 = text, 1=left 2=right 3=up 4=down
          } tbutton_t;

          enum { B_LEFT, B_RIGHT, B_UP, B_DOWN, B_GAS, B_BRAKE, B_DRIFT, B_ITEM, B_BACK, B_OK, B_LOOK, B_COUNT };

          static tbutton_t buttons[B_COUNT] =
          {
          	{ KEY_LEFTARROW,  "",    0,0,0,0, 200,200,200, 1 },
          	{ KEY_RIGHTARROW, "",    0,0,0,0, 200,200,200, 2 },
          	{ KEY_UPARROW,    "",    0,0,0,0, 200,200,200, 3 },
          	{ KEY_DOWNARROW,  "",    0,0,0,0, 200,200,200, 4 },
          	{ 'a',            "GAS", 0,0,0,0,  60,200, 60, 0 },
          	{ 'd',            "BRK", 0,0,0,0, 220, 60, 60, 0 },
          	{ 's',            "DRF", 0,0,0,0,  70,130,240, 0 },
          	{ KEY_SPACE,      "ITM", 0,0,0,0, 240,200, 40, 0 },
          	{ KEY_ESCAPE,     "ESC", 0,0,0,0, 160,160,160, 0 },
          	{ KEY_ENTER,      "OK",  0,0,0,0, 255,255,255, 0 },
          	{ KEY_LSHIFT,     "LK",  0,0,0,0, 150,100,200, 0 },
          };

          #define MAXFINGERS 10
          static struct { SDL_FingerID id; int btn; SDL_bool used; } fingers[MAXFINGERS];
          static int btncount[B_COUNT];
          static int layout_w = 0, layout_h = 0;

          static void Touch_Layout(int w, int h)
          {
          	float s, m, gap, cx, cy, rx, ry, big;
          	if (w == layout_w && h == layout_h)
          		return;
          	layout_w = w;
          	layout_h = h;

          	s = (float)h * 0.17f;      // base button size
          	m = (float)h * 0.04f;      // margin
          	gap = s * 0.10f;
          	big = s * 1.25f;

          	// D-pad, bottom left
          	cx = m + s * 1.1f + gap;
          	cy = (float)h - m - s * 2.2f - gap;
          	buttons[B_LEFT]  = (tbutton_t){ KEY_LEFTARROW,  "", cx - s * 1.1f - gap, cy, s * 1.1f, s * 1.1f, 200,200,200, 1 };
          	buttons[B_RIGHT] = (tbutton_t){ KEY_RIGHTARROW, "", cx + gap,            cy, s * 1.1f, s * 1.1f, 200,200,200, 2 };
          	buttons[B_UP]    = (tbutton_t){ KEY_UPARROW,    "", cx - s * 0.55f,      cy - s * 1.1f - gap, s * 1.1f, s * 1.1f, 200,200,200, 3 };
          	buttons[B_DOWN]  = (tbutton_t){ KEY_DOWNARROW,  "", cx - s * 0.55f,      cy + s * 1.1f + gap, s * 1.1f, s * 1.1f, 200,200,200, 4 };

          	// Action buttons, bottom right (2x2)
          	rx = (float)w - m - big * 2.0f - gap;
          	ry = (float)h - m - big * 2.0f - gap;
          	buttons[B_DRIFT].x = rx;              buttons[B_DRIFT].y = ry;
          	buttons[B_ITEM].x  = rx + big + gap;  buttons[B_ITEM].y  = ry;
          	buttons[B_BRAKE].x = rx;              buttons[B_BRAKE].y = ry + big + gap;
          	buttons[B_GAS].x   = rx + big + gap;  buttons[B_GAS].y   = ry + big + gap;
          	buttons[B_DRIFT].w = buttons[B_DRIFT].h = big;
          	buttons[B_ITEM].w  = buttons[B_ITEM].h  = big;
          	buttons[B_BRAKE].w = buttons[B_BRAKE].h = big;
          	buttons[B_GAS].w   = buttons[B_GAS].h   = big;

          	// Top row: ESC / OK / LOOK
          	buttons[B_BACK].x = (float)w - m - s * 0.9f;       buttons[B_BACK].y = m;
          	buttons[B_OK].x   = (float)w - m - s * 1.9f - gap; buttons[B_OK].y   = m;
          	buttons[B_LOOK].x = (float)w - m - s * 2.9f - gap * 2; buttons[B_LOOK].y = m;
          	buttons[B_BACK].w = buttons[B_BACK].h = s * 0.9f;
          	buttons[B_OK].w   = buttons[B_OK].h   = s * 0.9f;
          	buttons[B_LOOK].w = buttons[B_LOOK].h = s * 0.9f;
          }

          static int Touch_HitTest(float px, float py)
          {
          	int i;
          	for (i = 0; i < B_COUNT; i++)
          	{
          		const tbutton_t *b = &buttons[i];
          		// small tolerance around each button
          		float t = b->w * 0.06f;
          		if (px >= b->x - t && px <= b->x + b->w + t && py >= b->y - t && py <= b->y + b->h + t)
          			return i;
          	}
          	return -1;
          }

          static void Touch_PostKey(INT32 key, evtype_t type)
          {
          	event_t ev;
          	ev.type = type;
          	ev.data1 = key;
          	ev.data2 = 0;
          	ev.data3 = 0;
          	D_PostEvent(&ev);
          }

          static void Touch_Press(int btn)
          {
          	if (btn < 0) return;
          	if (btncount[btn]++ == 0)
          		Touch_PostKey(buttons[btn].key, ev_keydown);
          }

          static void Touch_Release(int btn)
          {
          	if (btn < 0) return;
          	if (btncount[btn] > 0 && --btncount[btn] == 0)
          		Touch_PostKey(buttons[btn].key, ev_keyup);
          }

          void Touch_HandleFingerEvent(SDL_Renderer *renderer, const SDL_TouchFingerEvent *f, Uint32 type)
          {
          	int w = 0, h = 0, i, slot = -1, btn;
          	float px, py;

          	if (!renderer)
          		return;
          	SDL_GetRendererOutputSize(renderer, &w, &h);
          	if (w <= 0 || h <= 0)
          		return;
          	Touch_Layout(w, h);

          	px = f->x * (float)w;
          	py = f->y * (float)h;
          	btn = Touch_HitTest(px, py);

          	for (i = 0; i < MAXFINGERS; i++)
          		if (fingers[i].used && fingers[i].id == f->fingerId)
          			slot = i;

          	if (type == SDL_FINGERDOWN)
          	{
          		if (slot < 0)
          			for (i = 0; i < MAXFINGERS; i++)
          				if (!fingers[i].used) { slot = i; break; }
          		if (slot < 0)
          			return;
          		fingers[slot].used = SDL_TRUE;
          		fingers[slot].id = f->fingerId;
          		fingers[slot].btn = btn;
          		Touch_Press(btn);
          	}
          	else if (type == SDL_FINGERMOTION)
          	{
          		if (slot < 0)
          			return;
          		if (fingers[slot].btn != btn)
          		{
          			Touch_Release(fingers[slot].btn);
          			fingers[slot].btn = btn;
          			Touch_Press(btn);
          		}
          	}
          	else if (type == SDL_FINGERUP)
          	{
          		if (slot < 0)
          			return;
          		Touch_Release(fingers[slot].btn);
          		fingers[slot].used = SDL_FALSE;
          		fingers[slot].btn = -1;
          	}
          }

          // ---- tiny 3x5 font for button labels ----
          static const struct { char c; const char *rows[5]; } font3x5[] =
          {
          	{ 'A', { "010", "101", "111", "101", "101" } },
          	{ 'B', { "110", "101", "110", "101", "110" } },
          	{ 'C', { "011", "100", "100", "100", "011" } },
          	{ 'D', { "110", "101", "101", "101", "110" } },
          	{ 'E', { "111", "100", "110", "100", "111" } },
          	{ 'F', { "111", "100", "110", "100", "100" } },
          	{ 'G', { "011", "100", "101", "101", "011" } },
          	{ 'I', { "111", "010", "010", "010", "111" } },
          	{ 'K', { "101", "101", "110", "101", "101" } },
          	{ 'L', { "100", "100", "100", "100", "111" } },
          	{ 'M', { "101", "111", "111", "101", "101" } },
          	{ 'O', { "010", "101", "101", "101", "010" } },
          	{ 'R', { "110", "101", "110", "101", "101" } },
          	{ 'S', { "011", "100", "010", "001", "110" } },
          	{ 'T', { "111", "010", "010", "010", "010" } },
          };

          static const char *const *Touch_Glyph(char c)
          {
          	size_t i;
          	for (i = 0; i < sizeof font3x5 / sizeof font3x5[0]; i++)
          		if (font3x5[i].c == c)
          			return font3x5[i].rows;
          	return NULL;
          }

          static void Touch_DrawText(SDL_Renderer *r, const char *text, float x, float y, float px)
          {
          	for (; *text; text++)
          	{
          		const char *const *g = Touch_Glyph(*text);
          		int row, col;
          		if (g)
          			for (row = 0; row < 5; row++)
          				for (col = 0; col < 3; col++)
          					if (g[row][col] == '1')
          					{
          						SDL_Rect rc = { (int)(x + col * px), (int)(y + row * px), (int)px + 1, (int)px + 1 };
          						SDL_RenderFillRect(r, &rc);
          					}
          		x += px * 4;
          	}
          }

          static void Touch_DrawArrow(SDL_Renderer *r, const tbutton_t *b)
          {
          	// simple filled triangle drawn with horizontal/vertical lines
          	int i, n = (int)(b->w * 0.5f);
          	float cx = b->x + b->w * 0.5f, cy = b->y + b->h * 0.5f, half = b->w * 0.28f;
          	for (i = 0; i < n; i++)
          	{
          		float t = (float)i / (float)n;       // 0..1 along the arrow
          		float len = half * (1.0f - t);       // shrinks toward the tip
          		switch (b->arrow)
          		{
          			case 1: SDL_RenderDrawLine(r, (int)(cx + half - t * half * 2), (int)(cy - len), (int)(cx + half - t * half * 2), (int)(cy + len)); break;
          			case 2: SDL_RenderDrawLine(r, (int)(cx - half + t * half * 2), (int)(cy - len), (int)(cx - half + t * half * 2), (int)(cy + len)); break;
          			case 3: SDL_RenderDrawLine(r, (int)(cx - len), (int)(cy + half - t * half * 2), (int)(cx + len), (int)(cy + half - t * half * 2)); break;
          			case 4: SDL_RenderDrawLine(r, (int)(cx - len), (int)(cy - half + t * half * 2), (int)(cx + len), (int)(cy - half + t * half * 2)); break;
          		}
          	}
          }

          void Touch_Draw(SDL_Renderer *renderer)
          {
          	int w = 0, h = 0, i, lw = 0, lh = 0;
          	SDL_BlendMode oldblend;
          	Uint8 or_, og, ob, oa;

          	if (!renderer)
          		return;
          	SDL_GetRendererOutputSize(renderer, &w, &h);
          	if (w <= 0 || h <= 0)
          		return;
          	Touch_Layout(w, h);

          	SDL_RenderGetLogicalSize(renderer, &lw, &lh);
          	SDL_RenderSetLogicalSize(renderer, 0, 0);
          	SDL_GetRenderDrawBlendMode(renderer, &oldblend);
          	SDL_GetRenderDrawColor(renderer, &or_, &og, &ob, &oa);
          	SDL_SetRenderDrawBlendMode(renderer, SDL_BLENDMODE_BLEND);

          	for (i = 0; i < B_COUNT; i++)
          	{
          		const tbutton_t *b = &buttons[i];
          		SDL_Rect rc = { (int)b->x, (int)b->y, (int)b->w, (int)b->h };
          		Uint8 fill = btncount[i] ? 140 : 60;

          		SDL_SetRenderDrawColor(renderer, b->r, b->g, b->b, fill);
          		SDL_RenderFillRect(renderer, &rc);
          		SDL_SetRenderDrawColor(renderer, b->r, b->g, b->b, 170);
          		SDL_RenderDrawRect(renderer, &rc);

          		SDL_SetRenderDrawColor(renderer, 255, 255, 255, 210);
          		if (b->arrow)
          			Touch_DrawArrow(renderer, b);
          		else
          		{
          			float px = b->w / 18.0f;
          			int len = (int)SDL_strlen(b->label);
          			float tw = (len * 4 - 1) * px;
          			if (px < 1.0f) px = 1.0f;
          			Touch_DrawText(renderer, b->label, b->x + (b->w - tw) * 0.5f, b->y + (b->h - 5 * px) * 0.5f, px);
          		}
          	}

          	SDL_SetRenderDrawColor(renderer, or_, og, ob, oa);
          	SDL_SetRenderDrawBlendMode(renderer, oldblend);
          	SDL_RenderSetLogicalSize(renderer, lw, lh);
          }

          #endif // __ANDROID__
          END_OF_FILE_1

          cat > "$WORK/overlay/i_touch.h" <<'END_OF_FILE_2'
          // Touchscreen overlay for SRB2Kart on Android.
          #ifndef __I_TOUCH_H__
          #define __I_TOUCH_H__

          #ifdef __ANDROID__
          #include "SDL.h"
          void Touch_HandleFingerEvent(SDL_Renderer *renderer, const SDL_TouchFingerEvent *f, Uint32 type);
          void Touch_Draw(SDL_Renderer *renderer);
          #endif

          #endif
          END_OF_FILE_2

          cat > "$WORK/overlay/Android.src.mk" <<'END_OF_FILE_3'
          LOCAL_PATH := $(call my-dir)

          include $(CLEAR_VARS)

          LOCAL_MODULE := main

          SDL_PATH := ../SDL
          MIXER_PATH := ../SDL_mixer

          LOCAL_C_INCLUDES := \
              $(LOCAL_PATH)/$(SDL_PATH)/include \
              $(LOCAL_PATH)/$(MIXER_PATH)/include \
              $(LOCAL_PATH)/kart \
              $(LOCAL_PATH)/kart/sdl

          # -fsigned-char: the game assumes plain "char" is signed (true on PC, false on ARM)
          LOCAL_CFLAGS := \
              -DHAVE_BLUA -DHAVE_MIXER -DHAVE_SDL -DHAVE_THREADS -DHAVE_ZLIB \
              -DLINUX -DUNIXCOMMON -DNONX86 -DNORUSEASM -DNOASM \
              -DSOUND=SOUND_MIXER \
              -fsigned-char -fno-strict-aliasing -w \
              -Wno-error=implicit-function-declaration \
              -Wno-error=int-conversion \
              -Wno-error=incompatible-pointer-types \
              -Wno-error=implicit-int

          LOCAL_SRC_FILES := \
              kart/am_map.c \
              kart/b_bot.c \
              kart/blua/lapi.c \
              kart/blua/lauxlib.c \
              kart/blua/lbaselib.c \
              kart/blua/lcode.c \
              kart/blua/ldebug.c \
              kart/blua/ldo.c \
              kart/blua/ldump.c \
              kart/blua/lfunc.c \
              kart/blua/lgc.c \
              kart/blua/linit.c \
              kart/blua/liolib.c \
              kart/blua/llex.c \
              kart/blua/lmem.c \
              kart/blua/lobject.c \
              kart/blua/lopcodes.c \
              kart/blua/lparser.c \
              kart/blua/lstate.c \
              kart/blua/lstring.c \
              kart/blua/lstrlib.c \
              kart/blua/ltable.c \
              kart/blua/ltablib.c \
              kart/blua/ltm.c \
              kart/blua/lundump.c \
              kart/blua/lvm.c \
              kart/blua/lzio.c \
              kart/command.c \
              kart/comptime.c \
              kart/console.c \
              kart/d_clisrv.c \
              kart/d_main.c \
              kart/d_net.c \
              kart/d_netcmd.c \
              kart/d_netfil.c \
              kart/dehacked.c \
              kart/f_finale.c \
              kart/f_wipe.c \
              kart/filesrch.c \
              kart/g_game.c \
              kart/g_input.c \
              kart/http-mserv.c \
              kart/hu_stuff.c \
              kart/i_tcp.c \
              kart/i_time.c \
              kart/info.c \
              kart/k_kart.c \
              kart/lua_baselib.c \
              kart/lua_blockmaplib.c \
              kart/lua_consolelib.c \
