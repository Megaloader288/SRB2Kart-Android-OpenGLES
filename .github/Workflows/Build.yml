          }
          END_OF_FILE_6

          cat > "$WORK/overlay/PermissionActivity.java" <<'END_OF_FILE_7'
          package org.libsdl.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Launcher screen. The game reads its files from /sdcard/SRB2Kart, so it needs
           * "all files access". Once granted, this screen starts the game.
           */
          public class PermissionActivity extends Activity {

              private boolean hasAccess() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      return Environment.isExternalStorageManager();
                  }
                  if (Build.VERSION.SDK_INT >= 23) {
                      return checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
                  }
                  return true;
              }

              private void askAccess() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                  Uri.parse("package:" + getPackageName())));
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                      }
                  } else if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[] {
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE }, 1);
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(48, 48, 48, 48);

                  TextView text = new TextView(this);
                  text.setTextSize(16);
                  text.setGravity(Gravity.CENTER);
                  text.setText("SRB2Kart butuh izin \"Akses semua file\" untuk membaca file game dari folder:\n\n"
                          + "/sdcard/SRB2Kart\n\n"
                          + "Ketuk tombol di bawah, aktifkan izinnya, lalu kembali ke aplikasi ini.");
                  root.addView(text);

                  Button button = new Button(this);
                  button.setText("Berikan izin");
                  button.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { askAccess(); }
                  });
                  root.addView(button);

                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (hasAccess()) {
                      startActivity(new Intent(this, KartActivity.class));
                      finish();
                  }
              }
          }
          END_OF_FILE_7

          cat > "$WORK/overlay/app_build.gradle" <<'END_OF_FILE_8'
          apply plugin: 'com.android.application'

          android {
              namespace "org.libsdl.app"
              compileSdk 34
              ndkVersion "26.3.11579264"

              defaultConfig {
                  applicationId "com.srb2kart.mobile"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild {
                      ndkBuild {
                          arguments "APP_PLATFORM=android-24"
                          abiFilters 'arm64-v8a'
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              applicationVariants.all { variant ->
                  tasks["merge${variant.name.capitalize()}Assets"]
                      .dependsOn("externalNativeBuild${variant.name.capitalize()}")
              }
              sourceSets.main {
                  jniLibs.srcDir 'libs'
              }
              externalNativeBuild {
                  ndkBuild {
                      path 'jni/Android.mk'
                  }
              }
              lint {
                  abortOnError false
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
          }
          END_OF_FILE_8

          # ---------- 2. Get the sources (pinned versions) ----------
          git clone https://github.com/STJr/Kart-Public.git kart
          git -C kart checkout -q 44b4a6852858eebba5f9f50da2ac9f4b2889ad1a
          python3 overlay/apply_android_changes.py kart/src
          cp overlay/i_touch.c overlay/i_touch.h kart/src/sdl/

          curl -fsSL -o sdl2.tgz https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
          curl -fsSL -o mixer.tgz https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-2.8.0.tar.gz
          tar xzf sdl2.tgz
          tar xzf mixer.tgz

          # ---------- 3. Assemble the Android project ----------
          cp -r SDL2-2.30.9/android-project proj
          J=proj/app/jni
          mkdir -p $J/SDL $J/SDL_mixer $J/src/kart
          cp -r SDL2-2.30.9/include SDL2-2.30.9/src SDL2-2.30.9/Android.mk $J/SDL/
          cp -r SDL2_mixer-2.8.0/include SDL2_mixer-2.8.0/src SDL2_mixer-2.8.0/Android.mk $J/SDL_mixer/
          sed -i 's/SUPPORT_WAVPACK ?= true/SUPPORT_WAVPACK ?= false/' $J/SDL_mixer/Android.mk
          cp -r kart/src/. $J/src/kart/
          rm -rf $J/src/kart/Android.mk $J/src/kart/android $J/src/CMakeLists.txt $J/CMakeLists.txt
          cp overlay/Android.src.mk $J/src/Android.mk
          cp overlay/Application.mk $J/Application.mk
          cp overlay/app_build.gradle proj/app/build.gradle
          cp overlay/AndroidManifest.xml proj/app/src/main/AndroidManifest.xml
          cp overlay/KartActivity.java overlay/PermissionActivity.java proj/app/src/main/java/org/libsdl/app/
          sed -i 's|<string name="app_name">Game</string>|<string name="app_name">SRB2Kart</string>|' proj/app/src/main/res/values/strings.xml
          echo "org.gradle.jvmargs=-Xmx3g" >> proj/gradle.properties

          # ---------- 4. Build ----------
          cd proj
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$WORK/build.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          mkdir -p "$WORK/out"
          if [ "$STATUS" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "$WORK/out/SRB2Kart-debug.apk"
          fi
          exit $STATUS

      - name: Show errors (only if the build failed)
        if: failure()
        run: |
          {
            echo "## Build failed - copy the text below and send it to Claude"
            echo '```'
            grep -n -E "error:|FAILED|What went wrong|undefined reference|fatal" work/build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: work/build.log
          if-no-files-found: ignore

      - name: Publish APK as a release (easy download on a phone)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" work/out/SRB2Kart-debug.apk \
            --repo "${{ github.repository }}" \
            --title "SRB2Kart Android build ${{ github.run_number }}" \
            --notes "Debug APK. Install it, then copy the game files to /sdcard/SRB2Kart."
            
